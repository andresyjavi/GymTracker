// ---------------------------------------------------------------- resumen mensual
function recapPhrase(month) {
  const list = C.PHRASES.month;
  const k = month.getFullYear() * 12 + month.getMonth();
  return list[k % list.length];
}
function recapFacts(r) {
  const f = [];
  if (r.star) f.push(['Ejercicio estrella', `${exName(r.star.exerciseId)}: ${r.star.usesE1RM ? '1RM estimado' : 'peso máximo'} ${wNum(r.star.before, 1)} → ${wNum(r.star.after, 1)} ${unit()} (${fmtPct(r.star.pct)})`]);
  if (r.heaviest) f.push(['Serie más pesada', `${exName(r.heaviest.exerciseId)}: ${fmtW(r.heaviest.weight)} × ${r.heaviest.reps}`]);
  if (r.topGroup) f.push(['Grupo más trabajado', `${C.GROUP_LABELS[r.topGroup.key]} · ${plural(r.topGroup.sets, 'serie', 'series')}`]);
  if (r.topExercise) f.push(['Ejercicio más repetido', `${exName(r.topExercise.key)} · ${plural(r.topExercise.count, 'sesión', 'sesiones')}`]);
  if (r.topWeekday) f.push(['Tu día favorito', `${cap(WEEKDAYS[Number(r.topWeekday.key)])} · ${plural(r.topWeekday.count, 'sesión', 'sesiones')}`]);
  if (r.topType) f.push(['Tipo de día más frecuente', `${C.TYPE_LABELS[r.topType.key]} · ${r.topType.count}`]);
  if (r.longestSession) f.push(['Sesión más larga', fmtDur(r.longestSession)]);
  f.push(['Ejercicios distintos', String(r.distinctExercises)]);
  return f;
}
function viewMonthRecap() {

  const facts = recapFacts(r);
  const vg = r.groups, maxG = Math.max(1, ...Object.values(vg).map((x) => x.sets));
  return nav + `

    ${tile('Series de trabajo', r.workSets, `Mes anterior: ${r.previous.workSets}`)}
    ${tile('Volumen', `${nf(toUnit(r.volume), 0)}<small>${unit()}</small>`, r.previous.volume ? `vs. mes anterior ${deltaHTML(r.volume - r.previous.volume, 'vol', S.pctChange(r.previous.volume, r.volume))}` : 'Sin mes anterior para comparar')}
    ${tile('Récords', r.strengthPRs.length, `de peso o 1RM · ${r.volumePRs.length} de volumen`)}
  </div>
  <section class="card"><div class="card-head"><h2>Destacados</h2></div>
    <div class="facts">${facts.map(([k, v]) => `<div class="fact"><span class="eyebrow">${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}</div></section>
  <div class="grid grid-2">
    <section class="card"><div class="card-head"><h2>Récords del mes</h2></div>

}

// ---------------------------------------------------------------- imagen del resumen
async function recapImageBlob(r, month) {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { /* sin API de fuentes */ }
  const W = 1080, H = 1350;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const v = (n) => css.getPropertyValue(n).trim();
  const disp = '"Barlow Condensed", "Arial Narrow", sans-serif', body = 'Barlow, system-ui, sans-serif';
  ctx.fillStyle = v('--bg'); ctx.fillRect(0, 0, W, H);
  // rejilla de placas sutil
  ctx.strokeStyle = v('--line'); ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(W - 120, 150, 70 + i * 55, 0, Math.PI * 2); ctx.stroke(); }
  const P = 80;
  ctx.fillStyle = v('--accent'); ctx.font = `700 34px ${disp}`; ctx.textBaseline = 'alphabetic';
  ctx.fillText('GYMTRACKER · RESUMEN MENSUAL', P, 120);
  ctx.fillStyle = v('--fg'); ctx.font = `700 132px ${disp}`;
  ctx.fillText(DF.month.format(month).toUpperCase(), P, 260, W - 2 * P);
  const stats = [
    ['SESIONES', String(r.sessions)], ['DÍAS', String(r.days)], ['TIEMPO', fmtDur(r.minutes)],
    ['SERIES', String(r.workSets)], ['VOLUMEN', nf(toUnit(r.volume), 0) + ' ' + unit()], ['RÉCORDS', String(r.strengthPRs.length)],
  ];
  const colW = (W - 2 * P) / 3;
  stats.forEach(([k, val], i) => {
    const x = P + (i % 3) * colW, y = 360 + Math.floor(i / 3) * 170;
    ctx.fillStyle = v('--muted'); ctx.font = `600 26px ${body}`; ctx.fillText(k, x, y);
    ctx.fillStyle = v('--fg'); ctx.font = `700 70px ${disp}`; ctx.fillText(val, x, y + 80, colW - 48);
  });
  let y = 720;
  ctx.fillStyle = v('--line'); ctx.fillRect(P, y, W - 2 * P, 2);
  y += 70;
  const facts = recapFacts(r).slice(0, 4);
  for (const [k, val] of facts) {
    ctx.fillStyle = v('--muted'); ctx.font = `600 24px ${body}`; ctx.fillText(k.toUpperCase(), P, y);
    ctx.fillStyle = v('--fg'); ctx.font = `600 36px ${body}`; ctx.fillText(val, P, y + 46, W - 2 * P);
    y += 104;
  }
  if (state.settings.fun) {
    ctx.fillStyle = v('--accent'); ctx.font = `600 40px ${disp}`;
    ctx.fillText('» ' + recapPhrase(month), P, H - 90, W - 2 * P);
  }
  return new Promise((res, rej) => cv.toBlob((b) => (b ? res(b) : rej(new Error('No se pudo generar la imagen'))), 'image/png'));
}
/** Ofrece un archivo: en la página publicada mediante el permiso del visor; en local, descarga normal. */
async function saveFile(filename, data, mime) {
  const dl = window.claude && window.claude.use ? await Promise.race([window.claude.use('downloads'), new Promise((r) => setTimeout(() => r(null), 1500))]) : null;
  if (dl) {
    try { await dl.save({ filename, data }); toast('Archivo guardado.'); }
    catch (e) { if (e && e.code !== 'declined') toast('No se pudo guardar aquí.', 'err'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  // Móviles (sobre todo iOS como app instalada): hoja de compartir del sistema → «Guardar en Archivos».
  try {
    const file = typeof File === 'function' ? new File([blob], filename, { type: mime }) : null;
    if (file && navigator.canShare && navigator.share && matchMedia('(pointer: coarse)').matches && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // la persona cerró la hoja de compartir
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast('No se pudo iniciar la descarga.', 'err'); }
}
async function openRecapImage() {
  const month = state.ui.recapMonth || S.startOfMonth(new Date());
  const r = S.monthRecap(state.sessions, exGroup, month);
  let blob;
  try { blob = await recapImageBlob(r, month); } catch (e) { toast(e.message, 'err'); return; }
  const url = URL.createObjectURL(blob);
  const fname = `gymtracker-${S.monthKey(month)}.png`;
  openModal({
    title: 'Imagen del resumen',
    body: `<img src="${url}" alt="Resumen de ${esc(DF.month.format(month))}" style="width:100%;border-radius:var(--r-md);border:1px solid var(--line)">
      <p class="small muted">En el móvil también puedes mantener pulsada la imagen para guardarla o compartirla.</p>`,
    actions: [{ label: ICON.download + 'Descargar PNG', cls: 'btn-primary', onClick: async () => { await saveFile(fname, blob, 'image/png'); return false; } }],
  });
  const prev = modalCleanup;
  modalCleanup = () => { if (prev) prev(); URL.revokeObjectURL(url); };
}

const BOARD_ORDER = ['week_sessions', 'streak', 'month_prs', 'strength30', 'month_sessions', 'month_days', 'month_sets', 'month_volume'];
const LEAD_QUIPS = [
  '{n} manda. El resto, a tomar notas.', '{n} va en cabeza. La gravedad presenta una queja.', '{n} lidera. Ya puede ir pidiendo la corona.',
  '{n} está en lo más alto. Por ahora.', 'Primer puesto para {n}. Que no se acomode.',
];
const TIE_QUIPS = ['Empate en lo alto. Esto se decide en la próxima sesión.', 'Igualados. El hierro dicta sentencia la semana que viene.'];
const LAST_QUIPS = ['{n} está calentando motores.', '{n} se reserva para el final, como los buenos.', '{n} tiene margen de mejora. Mucho margen.'];

function pickQuip(list, seed) { return list[Math.abs(hashStr(seed)) % list.length]; }
function ago(iso) {
  if (!iso) return 'nunca';
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'ahora mismo';
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24);
  return d === 1 ? 'ayer' : `hace ${d} días`;
}
function metricText(metric, v, summary) {
  if (v === null || v === undefined) return '—';
  if (metric === 'strength30') return (v > 0 ? '+' : v < 0 ? MINUS : '±') + nf(Math.abs(v), 1) + ' %';
  if (metric === 'month_volume') return fmtVol(v);
  return nf(v, 0);
}
function memberName(m) { return m.display_name || 'Sin nombre'; }
function initials(name) { return (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join(''); }
function avatar(m) {
  const hue = Math.abs(parseInt(hashStr(m.user_id || m.display_name || ''), 10)) % 360;
  return `<span class="avatar" style="--h:${hue}" aria-hidden="true">${esc(initials(memberName(m)))}</span>`;
}
function liftScoreText(l) {
  if (!l || !l.best) return '—';
  if (l.best.weight === undefined) return l.change30 ? metricText('strength30', l.change30.pct) : `${plural(l.sessions, 'sesión', 'sesiones')}`;
  return `${wNum(l.best.score, 1)} ${unit()}`;
}

// ---------------------------------------------------------------- ficha de un amigo
function viewFriendDetail(uid) {
  const g = social.groups.find((x) => x.id === social.activeGroup);
  const rows = g ? boardRows(g.id) || [] : [];
  const m = rows.find((r) => r.user_id === uid);
  const back = `<div class="row"><button class="btn btn-ghost btn-sm" data-action="fr-back">${ICON.back}Amigos</button></div>`;
  if (!m || !m.summary || m.summary.hidden) return back + `<div class="empty"><h3>Sin datos</h3><p>Esta persona no comparte su resumen.</p></div>`;
  const sm = m.summary;
  const now = new Date();
  const me = rows.find((r) => r.is_me);
  const vs = (metric) => {
    if (!me || me.user_id === uid) return '';
    const a = S.metricValue(sm, metric, now), b = S.metricValue(me.summary, metric, now);
    if (a === null || b === null) return '';
    return `Tú: ${metricText(metric, b)}`;
  };
  const wkKey = S.dayKey(S.startOfWeek(now));
  const ms = sm.muscles && sm.week && sm.week.key === wkKey ? sm.muscles.week || {} : {};
  return back + `
  <div class="page-head"><div class="row" style="gap:14px">${avatar(m).replace('class="avatar"', 'class="avatar lg"')}<div><p class="eyebrow">${esc(sm.level ? 'Nivel ' + sm.level.level + ' · ' + sm.level.title : 'Amigo')}</p><h1>${esc(memberName(m))}</h1>
    <p class="sub">Actualizado ${ago(m.updated_at)}${sm.last ? ` · última sesión ${fmtDate(sm.last.date + 'T12:00:00')} (${esc(C.TYPE_SHORT[sm.last.type] || sm.last.type)})` : ''}</p></div></div></div>
  <div class="grid grid-tiles">
    ${tile('Esta semana', `${metricText('week_sessions', S.metricValue(sm, 'week_sessions', now))}<small>sesiones</small>`, vs('week_sessions'))}
    ${tile('Racha', `${metricText('streak', S.metricValue(sm, 'streak', now))}<small>semanas</small>`, vs('streak'))}
    ${tile('Récords este mes', metricText('month_prs', S.metricValue(sm, 'month_prs', now)), vs('month_prs'))}
    ${tile('Mejora 30 días', metricText('strength30', S.metricValue(sm, 'strength30', now)), vs('strength30'))}
    ${tile('Sesiones totales', nf(sm.totals ? sm.totals.sessions : 0, 0), sm.totals && sm.totals.since ? 'desde ' + fmtDate(sm.totals.since + 'T12:00:00') : '')}
    ${tile('Logros', nf(sm.achievements || 0, 0), 'de ' + S.ACHIEVEMENTS.length)}
  </div>
  <section class="card"><div class="card-head"><h2>Mapa muscular de esta semana</h2></div>
    <div class="mc"><div class="mc-map">${bodyMapSVG({ level: (k) => S.weeklySetsLevel(ms[k] || 0), title: (k) => `${C.MUSCLE_LABELS[k]}: ${nf(ms[k] || 0, 1)} series`, ariaLabel: 'Mapa muscular de ' + memberName(m) })}</div>
    <div class="stack" style="gap:4px">${S.MUSCLES.filter((k) => ms[k]).sort((a, b) => ms[b] - ms[a]).slice(0, 8).map((k) => `<div class="row spread small"><span><i class="sw lv${S.weeklySetsLevel(ms[k])}" style="margin-right:6px"></i>${esc(C.MUSCLE_SHORT[k])}</span><b class="num">${nf(ms[k], 1)}</b></div>`).join('') || '<p class="small muted">Sin series esta semana.</p>'}</div></div></section>
  <section class="card"><div class="card-head"><h2>Ejercicios principales</h2><span class="small muted">${sm.weights === false ? 'Oculta sus kilos' : 'Mejor marca'}</span></div>
    ${(sm.lifts || []).length ? `<div class="table-wrap"><table class="data"><thead><tr><th>Ejercicio</th><th class="r">Sesiones</th><th class="r">Mejor</th><th class="r">30 días</th></tr></thead><tbody>
      ${sm.lifts.map((l) => `<tr><td>${esc(l.name)}</td><td class="r">${esc(l.sessions)}</td><td class="r">${l.best && l.best.weight !== undefined ? `${fmtW(l.best.weight)} × ${esc(l.best.reps)}<br><span class="small faint">${l.best.e1rm ? '1RM est. ' + wNum(l.best.score, 1) : ''}</span>` : '—'}</td><td class="r ${l.change30 ? deltaCls(l.change30.pct) : ''}">${l.change30 ? metricText('strength30', l.change30.pct) : '<span class="faint">—</span>'}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">Sin ejercicios todavía.</p>'}</section>

}

// ---------------------------------------------------------------- acciones
/** Ejecuta una acción de red. Con `form`, no se repinta la pantalla hasta que acaba bien,
    para no perder lo escrito si hay un error. */
async function socialRun(fn, okMsg, form) {
  if (social.busy) return false;
  social.busy = true;
  const btn = form ? form.querySelector('[type="submit"]') : null;
  const label = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Un momento…'; } else render();
  try {
    const r = await fn();
    social.busy = false;
    render();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg, 'good', 3000);
    return true;
  } catch (e) {
    console.warn(e);
    social.busy = false;
    if (btn && btn.isConnected) {
      btn.disabled = false; btn.innerHTML = label;
      const el = form.querySelector('.form-err') || document.getElementById('fr-err');
      if (el) { el.textContent = e.message; el.hidden = false; } else toast(e.message, 'err', 5000);
    } else { render(); toast(e.message, 'err', 5000); }
    return false;
  }
}
async function socialLoadActive() {
  if (!loggedIn() || !social.activeGroup) return;
  try { await socialFetchBoard(social.activeGroup); } catch (e) { if (e.code === 'no_miembro') await socialRefreshGroups().catch(() => {}); else if (e.code !== 'offline') toast(e.message, 'err', 4000); }
  if (state.route.view === 'amigos') render();
}
async function shareInvite(g) {
  const url = inviteLink(g.invite_code);
  const text = `Únete a «${g.name}» en GymTracker para picarnos con las estadísticas. Código: ${g.invite_code}`;
  try {
    if (navigator.share && matchMedia('(pointer: coarse)').matches) { await navigator.share({ title: 'GymTracker', text, url }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  openModal({
    title: 'Invitar al grupo',
    body: `<p class="small">Manda este enlace a tus amigos. Al abrirlo, crean su cuenta y entran directamente en «${esc(g.name)}».</p>
      <label class="field" for="inv-link">Enlace<input class="input" id="inv-link" readonly value="${esc(url)}"></label>
      <p class="small muted">O diles que entren en Amigos → «Unirme con un código» y escriban <b class="code">${esc(g.invite_code)}</b>.</p>`,
    actions: [{ label: ICON.copy + 'Copiar enlace', cls: 'btn-primary', onClick: async (close, root) => {
      try { await navigator.clipboard.writeText(text + '\n' + url); toast('Enlace copiado.'); }
      catch (e) { const i = $('#inv-link', root); i.focus(); i.select(); toast('Enlace seleccionado: cópialo.'); }
      return false;
    } }],
  });
}
const SocialActions = {
  'fr-mode': (el) => { state.ui.frMode = el.dataset.m; render(); },

  },

    if (ok) socialRun(() => socialDeleteMine(), 'Datos compartidos borrados. Has salido de tus grupos.');

async function onSocialSubmit(form) {
  const v = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const err = (msg) => { const el = form.querySelector('.form-err') || form.querySelector('#fr-err'); if (el) { el.textContent = msg; el.hidden = false; } else toast(msg, 'err'); };
  if (form.id === 'fr-auth') {
    const mode = state.ui.frMode || 'signup';
    const name = v('fr-name'), email = v('fr-email'), pass = document.getElementById('fr-pass').value;
    if (mode === 'signup' && (name.length < 1 || name.length > 30)) return err('Escribe tu nombre visible (hasta 30 caracteres).');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err('Escribe un email válido.');
    if (pass.length < (mode === 'signup' ? 8 : 6)) return err(mode === 'signup' ? 'Usa una contraseña de al menos 8 caracteres (y que no uses en otras webs).' : 'La contraseña tiene al menos 6 caracteres.');
    state.ui.frNameDraft = name;
    await socialRun(() => (mode === 'signup' ? socialSignUp(name, email, pass) : socialSignIn(email, pass)), mode === 'signup' ? '¡Cuenta creada! Ya puedes crear un grupo o unirte a uno.' : 'Has entrado.', form);
    socialLoadActive();
  } else if (form.id === 'fr-name-form' || form.id === 'fr-rename') {
    const name = v(form.id === 'fr-rename' ? 'fr-name3' : 'fr-name2');
    if (name.length < 1 || name.length > 30) return err('El nombre debe tener entre 1 y 30 caracteres.');
    social.name = name; await socialSave();
    await socialRun(async () => { await socialPublish(true); await socialAfterLogin(); }, 'Nombre guardado.', form);
    socialLoadActive();
  } else if (form.id === 'fr-create') {
    const name = v('fr-gname');
    if (!name) return err('Escribe un nombre para el grupo.');
    await socialRun(() => socialCreateGroup(name), (g) => `Grupo «${g.name}» creado. Ahora invita a tus amigos.`, form);
    socialLoadActive();
  } else if (form.id === 'fr-join') {
    const code = v('fr-code');
    if (code.length < 4) return err('Escribe el código que te han pasado.');
    await socialRun(() => socialJoin(code), (g) => `Te has unido a «${g.name}».`, form);
  }
}

/** Tarjeta corta en Inicio con tu puesto de la semana. */
function friendsMini() {
  if (!socialReady() || !loggedIn() || !social.activeGroup) return '';
  const g = social.groups.find((x) => x.id === social.activeGroup);
  const rows = g && boardRows(g.id);
  if (!rows || rows.length < 2) return '';
  const ranked = S.rankMembers(rows, 'week_sessions');
  const me = ranked.find((r) => r.member.is_me);
  const lead = ranked[0];
  const n = ranked.filter((r) => r.rank).length;
  const pos = me && me.rank ? `Vas <b>${me.rank}.º de ${n}</b> en «${esc(g.name)}» esta semana` : `«${esc(g.name)}»`;
  const leadTxt = lead && lead.value > 0 && !lead.member.is_me ? ` · ${esc(memberName(lead.member))} lidera con ${plural(lead.value, 'sesión', 'sesiones')}` : lead && lead.member.is_me && lead.value > 0 ? ' · vas en cabeza' : '';
  return `<section class="card friends-mini"><div class="row spread"><div class="row" style="gap:10px">${ICON.users}<p>${pos}${leadTxt}.</p></div>
    <button class="btn btn-sm" data-action="nav" data-view="amigos">Ver grupo</button></div></section>`;
}

    title: 'Importar copia de seguridad',
    body: `<p class="small">Elige un archivo .json exportado desde GymTracker o pega su contenido. Primero se revisa; no se cambia nada hasta que confirmes.</p>
      <label class="field" for="imp-file">Archivo<input class="input" type="file" id="imp-file" accept=".json,application/json"></label>
      <label class="field" for="imp-text">O pega el contenido<textarea class="input" id="imp-text" style="min-height:120px;font-family:ui-monospace,monospace;font-size:0.78rem" placeholder='{"format":"gymtracker-backup", …}'></textarea></label>
      <div id="imp-result"></div>`,
    actions: [
      { label: 'Cancelar', cls: 'btn-ghost' },
      { label: 'Revisar', cls: '', onClick: (close, root) => { plan = reviewImport(root); return false; } },
      { label: 'Importar', cls: 'btn-primary', onClick: async (close, root) => {
        if (!plan) plan = reviewImport(root);
        if (!plan) return false;
        if (!plan.sessionsToAdd.length && !plan.exercisesToAdd.length) { toast('No hay nada nuevo que importar.'); return false; }
        try {
          await flushSessions();
          await DB.putMany('exercises', plan.exercisesToAdd);
          await DB.putMany('sessions', plan.sessionsToAdd);
        } catch (e) { toast('Error al guardar la importación. No se ha completado.', 'err'); return false; }
        await loadAll();
        socialDirty(2000);
        toast(`Importadas ${plural(plan.sessionsToAdd.length, 'sesión', 'sesiones')}${plan.duplicateSessions ? ` · ${plan.duplicateSessions} duplicadas omitidas` : ''}.`, 'good', 4000);
        render();
      } },
    ],
    onOpen: (root) => {
      $('#imp-file', root).addEventListener('change', (ev) => {
        const f = ev.target.files[0];
        if (!f) return;
        if (f.size > 20 * 1024 * 1024) { toast('El archivo es demasiado grande (máx. 20 MB).', 'err'); return; }
        const r = new FileReader();
        r.onload = () => { $('#imp-text', root).value = String(r.result); plan = reviewImport(root); };
        r.onerror = () => toast('No se pudo leer el archivo.', 'err');
        r.readAsText(f);
      });
      $('#imp-text', root).addEventListener('input', () => { plan = null; $('#imp-result', root).innerHTML = ''; });
    },
  });
}
function reviewImport(root) {
  const out = $('#imp-result', root);
  const raw = $('#imp-text', root).value.trim();
  if (!raw) { out.innerHTML = '<p class="set-err" style="padding:0">Elige un archivo o pega el contenido.</p>'; return null; }
  let obj;
  try { obj = JSON.parse(raw); } catch (e) { out.innerHTML = '<p class="set-err" style="padding:0">El texto no es JSON válido. Comprueba que has copiado el archivo completo.</p>'; return null; }
  const v = S.validateBackup(obj);
  if (!v.ok) { out.innerHTML = `<div class="notice"><b>No se puede importar.</b><ul class="small" style="margin:6px 0 0;padding-left:18px">${v.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`; return null; }
  const hasActive = !!activeSession();
  const incoming = Object.assign({}, obj, { sessions: obj.sessions.filter((s) => (s.status || 'done') === 'done' || !hasActive).map((s) => Object.assign({ notes: '', endedAt: null }, s, { status: s.status || 'done' })) });
  const skippedActive = obj.sessions.length - incoming.sessions.length;
  const plan = S.planImport({ exercises: state.exercises, sessions: state.sessions }, incoming);
  out.innerHTML = `<div class="card" style="background:var(--surface-2)"><p><b>Copia válida.</b> Exportada ${obj.exportedAt ? fmtDate(obj.exportedAt) : 'sin fecha'}.</p>
    <ul class="small" style="margin:6px 0 0;padding-left:18px">
      <li>${plural(plan.sessionsToAdd.length, 'sesión nueva', 'sesiones nuevas')} se añadirán.</li>
      <li>${plural(plan.duplicateSessions, 'sesión ya existe', 'sesiones ya existen')} y se omitirán.</li>
      <li>${plural(plan.exercisesToAdd.length, 'ejercicio nuevo', 'ejercicios nuevos')}; los demás se asocian a los que ya tienes por nombre.</li>
      ${skippedActive ? `<li>${plural(skippedActive, 'sesión en curso se omite', 'sesiones en curso se omiten')} porque ya tienes una abierta.</li>` : ''}
    </ul><p class="small muted" style="margin-top:6px">Tus datos actuales no se borran ni se sobrescriben. Tus ajustes se mantienen.</p></div>`;
  return plan;
}
function resetModal() {
  openModal({
    title: 'Borrar todos los datos',
    body: `<p>Se eliminarán <b>${plural(state.sessions.length, 'sesión', 'sesiones')}</b>, tus ejercicios propios, favoritos y ajustes de este navegador. No se puede deshacer.</p>
      <p class="small muted">Te recomendamos exportar antes una copia en JSON.</p>
      <label class="field" for="reset-confirm">Escribe BORRAR para confirmar<input class="input" id="reset-confirm" autocomplete="off"></label>`,
    actions: [
      { label: 'Cancelar', cls: 'btn-ghost' },
      { label: 'Borrar todo', cls: 'btn-danger', onClick: async (close, root) => {
        if ($('#reset-confirm', root).value.trim().toUpperCase() !== 'BORRAR') { toast('Escribe BORRAR para confirmar.', 'err'); return false; }
        pendingSessions.clear();
        try { await DB.clear('sessions'); await DB.clear('exercises'); await DB.clear('meta'); } catch (e) { toast('No se pudieron borrar los datos.', 'err'); return false; }
        await seedCatalog();
        await loadAll();
        state.ui.greeting = null;
        go('inicio');
        toast('Datos borrados. Empiezas de cero.');
      } },
    ],
  });
}

// ---------------------------------------------------------------- navegación
const VIEWS = [
  ['inicio', 'Inicio', 'home'], ['entrenar', 'Entrenar', 'dumbbell'], ['historial', 'Historial', 'history'],
  ['progreso', 'Progreso', 'chart'], ['amigos', 'Amigos', 'users'], ['ejercicios', 'Ejercicios', 'list'], ['ajustes', 'Ajustes', 'settings'],
];
function go(view, sub = null) {
  state.route = { view, sub };
  if (view === 'amigos' && !sub && loggedIn()) {
    const b = social.activeGroup && social.boards[social.activeGroup];
    if (!b || Date.now() - new Date(b.at) > 60000) setTimeout(() => { socialPublish(false).catch(() => {}).then(socialLoadActive); }, 50);
  }
  state.ui.openSetMenu = null; state.ui.openEntryMenu = null;
  if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  render();
  window.scrollTo(0, 0);
}
function renderNav() {
  const act = activeSession();
  $('#nav').innerHTML = `<div class="nav-brand"><span class="brand">Gym<b>Tracker</b></span></div>` + VIEWS.map(([k, l, ic]) =>
    `<button data-action="nav" data-view="${k}" ${state.route.view === k ? 'aria-current="page"' : ''}>${ICON[ic]}<span>${l}</span>${k === 'entrenar' && act ? '<span class="live-dot" aria-label="sesión en curso"></span>' : ''}</button>`).join('');
}
function render() {
  if (!state.ready) return;
  chartSpecs.clear();
  renderNav();
  const r = state.route;
  let html;
  try {
    if (r.view === 'entrenar') {
      if (r.sub && r.sub.summaryId) html = viewSummary(r.sub.summaryId);
      else { const s = editingSession(); html = s ? viewEditor(s) : viewTrainStart(); }
    } else if (r.view === 'historial') html = viewHistory();
    else if (r.view === 'progreso') html = viewProgress();
    else if (r.view === 'ejercicios') html = viewExercises();
    else if (r.view === 'ajustes') html = viewSettings();
    else if (r.view === 'amigos') html = viewFriends();
    else html = viewHome();
  } catch (e) {
    console.error(e);
    html = `<div class="empty"><h3>Algo ha fallado al mostrar esta pantalla</h3><p>Tus datos siguen guardados. Prueba a volver al inicio o recargar la página. Detalle: ${esc(e.message)}</p><button class="btn" data-action="nav" data-view="inicio">Ir al inicio</button></div>`;
  }
  const view = $('#view');
  view.innerHTML = html;
  view.dataset.view = r.view;
  drawCharts();
  updateWakeLock();
}

// ---------------------------------------------------------------- acciones
const Actions = Object.assign({}, TrainActions, ExtraActions, SocialActions, {
  'nav': (el) => {
    const v = el.dataset.view;
    if (v === 'entrenar' && state.route.view === 'entrenar' && state.route.sub && state.route.sub.editId) { /* sigue editando */ }
    go(v);
  },
  'open-session': (el) => { go('historial', { sessionId: el.dataset.id }); },
  'back-history': () => go('historial'),
  'edit-session': (el) => { go('entrenar', { editId: el.dataset.id }); },
  'delete-session': async (el) => {
    const s = sessionById(el.dataset.id);
    const ok = await confirmModal({ title: 'Eliminar sesión', text: `Se eliminará la sesión de ${esc(C.TYPE_SHORT[s.type].toLowerCase())} del ${esc(fmtDate(s.startedAt))} con todas sus series. Las estadísticas se recalcularán. No se puede deshacer.`, confirmLabel: 'Eliminar', danger: true });
    if (!ok) return;
    await removeSession(s.id);
    go('historial');
    toast('Sesión eliminada.');
  },
  'compare-sessions': (el) => {
    const a = sessionById(el.dataset.a);
    state.ui.cmpType = a.type; state.ui.cmpA = el.dataset.a; state.ui.cmpB = el.dataset.b; state.ui.period = 'all';
    go('progreso');
    const c = document.getElementById('compare');
    if (c) c.scrollIntoView({ block: 'start' });
  },
  'hist-tab': (el) => { state.ui.hist.tab = el.dataset.tab; render(); },
  'hist-clear': () => { Object.assign(state.ui.hist, { from: '', to: '', type: '', ex: '', q: '' }); render(); },
  'cal-nav': (el) => { state.ui.calMonth = S.addMonths(state.ui.calMonth || S.startOfMonth(new Date()), Number(el.dataset.dir)); render(); },
  'cal-day': (el) => {
    const list = done().filter((s) => S.dayKey(s.startedAt) === el.dataset.day);
    if (list.length === 1) go('historial', { sessionId: list[0].id });
    else { Object.assign(state.ui.hist, { tab: 'lista', from: el.dataset.day, to: el.dataset.day, type: '', ex: '', q: '' }); render(); }
  },
  'set-period': (el) => { state.ui[el.dataset.key] = el.dataset.p; render(); },
  'open-exercise': (el) => { go('ejercicios', { exerciseId: el.dataset.ex, back: state.route.view, backSub: state.route.sub }); },
  'sheet-back': () => {
    const sub = state.route.sub || {};
    if (sub.back && sub.back !== 'ejercicios') go(sub.back, sub.backSub || null); else go('ejercicios');
  },
  'ex-metric': (el) => { state.ui.exMetric = el.dataset.m; render(); },
  'ex-group': (el) => { state.ui.exgroup = el.dataset.g; render(); },
  'ex-fav': () => { state.ui.favOnly = !state.ui.favOnly; render(); },
  'fav': async (el) => {
    const ex = state.exById.get(el.dataset.ex);
    ex.favorite = !ex.favorite;
    await saveExercise(ex);
    render();
    toast(ex.favorite ? 'Añadido a favoritos.' : 'Quitado de favoritos.', '', 1400);
  },
  'new-exercise': () => openExerciseForm(null),
  'edit-exercise': (el) => openExerciseForm(state.exById.get(el.dataset.ex)),
  'edit-muscles': (el) => openExerciseForm(state.exById.get(el.dataset.ex), { focusMuscles: true }),
  'unit': async (el) => { state.settings.unit = el.dataset.u; await saveSettings(); render(); },
  'routine-add': async () => { state.settings.routine.push($('#routine-add').value); await saveSettings(); render(); },
  'routine-remove': async (el) => { state.settings.routine.splice(Number(el.dataset.i), 1); await saveSettings(); render(); },
  'routine-move': async (el) => {
    const r = state.settings.routine, i = Number(el.dataset.i), j = i + Number(el.dataset.dir);
    if (j < 0 || j >= r.length) return;
    [r[i], r[j]] = [r[j], r[i]]; await saveSettings(); render();
  },
  'export-json': () => exportModal('json'),
  'export-csv': () => exportModal('csv'),
  'import': () => importModal(),
  'reset': () => resetModal(),
  'persist': async () => {
    try {
      if (!navigator.storage || !navigator.storage.persist) throw new Error('no');
      const ok = await navigator.storage.persist();
      state.ui.storageInfo = ok ? 'El navegador ha concedido almacenamiento persistente: no borrará estos datos automáticamente para liberar espacio.' : 'El navegador no lo ha concedido ahora. Los datos se guardan igualmente; exportar copias es la mejor garantía.';
    } catch (e) { state.ui.storageInfo = 'Este navegador no permite solicitarlo. Los datos se guardan igualmente.'; }
    render();
  },
});

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-action]');
  if (!el || el.disabled || !el.closest('#app')) return;
  const fn = Actions[el.dataset.action];
  if (!fn) return;
  ev.preventDefault();
  Promise.resolve(fn(el, ev)).catch((e) => { console.error(e); toast('Ha ocurrido un error: ' + e.message, 'err'); });
});
document.addEventListener('submit', (ev) => {
  const form = ev.target;
  if (!form.closest || !form.closest('#app')) return;
  ev.preventDefault();
  if (form.id && form.id.startsWith('fr-')) onSocialSubmit(form).catch((e) => toast(e.message, 'err'));
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.matches('.set-input')) onSetInput(el);
  else if (el.matches('[data-sess="notes"]')) onSessField(el);
  else if (el.matches('[data-hist="q"]')) {
    state.ui.hist.q = el.value;
    const list = $('#hist-list');
    if (list) { const items = filteredSessions(); list.innerHTML = items.length ? `<div class="list">${items.map(sessionListItem).join('')}</div>` : '<p class="muted" style="padding:14px 4px">Ninguna sesión coincide con los filtros.</p>'; }
  } else if (el.matches('[data-exq]')) {
    state.ui.exq = el.value;
    const pos = el.selectionStart;
    render();
    const ni = $('#ex-q'); if (ni) { ni.focus(); try { ni.setSelectionRange(pos, pos); } catch (e) { /* tipo search */ } }
  }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.matches('[data-sess]') && el.dataset.sess !== 'notes') onSessField(el);
  else if (el.matches('[data-hist]') && el.dataset.hist !== 'q') { state.ui.hist[el.dataset.hist] = el.value; render(); }
  else if (el.matches('[data-cmp]')) {
    state.ui[el.dataset.cmp] = el.value;
    if (el.dataset.cmp === 'cmpType') { state.ui.cmpA = ''; state.ui.cmpB = ''; }
    render(); const c = document.getElementById('compare'); if (c) c.scrollIntoView({ block: 'nearest' });
  } else if (el.matches('[data-fr-setting]')) {
    social.share[el.dataset.frSetting] = el.checked;
    socialSave().then(() => socialPublish(true)).then(() => { render(); toast(social.share.enabled ? 'Resumen actualizado para tu grupo.' : 'Has dejado de compartir tu resumen.'); })
      .catch((e) => { render(); toast(e.message, 'err', 4500); });
  } else if (el.matches('[data-setting="fun"]')) { state.settings.fun = el.checked; saveSettings().then(render); }
});
// regiones del mapa (SVG) activables con teclado
document.addEventListener('keydown', (ev) => {
  const el = ev.target;
  if ((ev.key === 'Enter' || ev.key === ' ') && el instanceof SVGElement && el.getAttribute('role') === 'button') {
    ev.preventDefault();
    el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }
});
// Enter en un campo de peso pasa a repeticiones; en repeticiones marca la serie
document.addEventListener('keydown', (ev) => {
  const el = ev.target;
  if (ev.key !== 'Enter' || !el.matches || !el.matches('.set-input')) return;
  ev.preventDefault();
  if (el.dataset.field === 'weight') { const r = document.getElementById('r-' + el.dataset.set); if (r) r.focus(); }
  else { const b = el.closest('.set-row').querySelector('.check-btn'); if (b && b.getAttribute('aria-pressed') !== 'true') b.click(); }
});
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (VIEWS.some(([k]) => k === v) && v !== state.route.view) go(v);
});

// ---------------------------------------------------------------- temporizador y pantalla encendida
setInterval(() => {
  const el = $('#timer');
  const s = activeSession();
  if (el && s && state.route.view === 'entrenar' && editingSession() === s) el.textContent = fmtClock(Date.now() - new Date(s.startedAt));
}, 1000);
let wakeLock = null;
async function updateWakeLock() {
  const want = state.route.view === 'entrenar' && !!activeSession() && !(state.route.sub && state.route.sub.summaryId);
  try {
    if (want && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; /* no disponible: no pasa nada */ }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) updateWakeLock(); });

// ---------------------------------------------------------------- carga inicial
const CATALOG_VERSION = 2;
function catalogItems(cat) {
  const list = [];
  for (const g of Object.keys(cat)) for (const name of cat[g]) list.push({ id: 'cat-' + slug(name), name, group: g, custom: false, favorite: false });
  return list;
}
async function seedCatalog() {
  await DB.putMany('exercises', catalogItems(C.CATALOG).concat(catalogItems(C.CATALOG_V2)));
  await DB.put('meta', { key: 'seeded', value: true });
  await DB.put('meta', { key: 'catalogVersion', value: CATALOG_VERSION });
}
/** Añade a instalaciones existentes los ejercicios nuevos del catálogo, sin tocar los que ya hay. */
async function migrateCatalog() {
  const v = await DB.get('meta', 'catalogVersion');
  if (v && v.value >= CATALOG_VERSION) return;
  const existing = new Set((await DB.all('exercises')).map((e) => e.id));
  const add = catalogItems(C.CATALOG_V2).filter((e) => !existing.has(e.id));
  if (add.length) await DB.putMany('exercises', add);
  await DB.put('meta', { key: 'catalogVersion', value: CATALOG_VERSION });
}
async function loadAll() {
  const [sessions, exercises, settings] = await Promise.all([DB.all('sessions'), DB.all('exercises'), DB.get('meta', 'settings')]);
  state.sessions = sessions || [];
  state.exercises = exercises || [];
  state.settings = Object.assign(clone(DEFAULT_SETTINGS), settings ? settings.value : {});
  // más de una sesión activa (p. ej. dos pestañas): se conserva la más reciente
  const actives = state.sessions.filter((s) => s.status === 'active').sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
  for (const s of actives.slice(1)) { s.status = 'done'; s.endedAt = s.endedAt || s.updatedAt || s.startedAt; await DB.put('sessions', s); }
  indexExercises();
  bump();
}
async function init() {
  await DB.open();
  try {
    const seeded = await DB.get('meta', 'seeded');
    if (!seeded) await seedCatalog(); else await migrateCatalog();
    await loadAll();
  } catch (e) {
    console.error(e);
    $('#view').innerHTML = `<div class="empty"><h3>No se han podido cargar los datos</h3><p>${esc(e.message)}. Prueba a recargar la página.</p></div>`;
    return;
  }
  await socialLoad();
  const invited = socialReady() && readInviteFromURL();
  if (invited) await socialSave();
  state.ready = true;
  const h = location.hash.slice(1);
  state.route = { view: invited ? 'amigos' : VIEWS.some(([k]) => k === h) ? h : (activeSession() ? 'entrenar' : 'inicio'), sub: null };
  render();
  if (socialReady() && loggedIn()) {
    if (invited) socialAfterLogin().then(render).catch((e) => toast(e.message, 'err', 4500));
    else {
      socialRefreshGroups().then(() => socialPublish(false)).then(socialLoadActive).catch(() => {});
    }
    if (state.route.view === 'amigos') socialLoadActive();
  }
  // Instalada en la pantalla de inicio: pide al navegador que no borre los datos para liberar espacio.
  try {
    const standaloneApp = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    if (standaloneApp && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) { /* sin API */ }
  if (DB.isMemory) toast('Este navegador no permite guardar datos: exporta una copia antes de cerrar.', 'err', 6000);
  try {
    if (navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()) state.ui.storageInfo = 'Almacenamiento persistente activado.';
  } catch (e) { /* sin API */ }
}
init();

})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
