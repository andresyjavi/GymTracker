/* GymTracker — amigos: cuenta, grupos y clasificaciones con Supabase.
   Los entrenamientos siguen guardándose solo en el dispositivo. Al servidor solo va
   el resumen que calcula S.buildSocialSummary (y solo si la persona lo permite). */

const SOCIAL_CFG = (() => {
  try {
    const m = document.querySelector('meta[name="gt-social"]');
    const c = m ? JSON.parse(m.getAttribute('content')) : null;
    return c && /^https:\/\/[a-z0-9-]+\.supabase\.co$|^http:\/\/127\.0\.0\.1:\d+$/.test(c.url) && typeof c.key === 'string' ? c : null;
  } catch (e) { return null; }
})();
const social = {
  loaded: false,
  session: null,        // {access_token, refresh_token, expires_at, user: {id, email}}
  name: '',
  share: { enabled: true, weights: true },
  groups: [],           // [{id, name, invite_code, members}]
  activeGroup: null,
  boards: {},           // gid → {at, rows}
  lastPublished: null,  // {at, hash}
  pendingJoin: null,
  busy: false,
  error: null,
  online: navigator.onLine !== false,
};
const SOCIAL_KEYS = ['session', 'name', 'share', 'groups', 'activeGroup', 'boards', 'lastPublished', 'pendingJoin'];

async function socialLoad() {
  try {
    const row = await DB.get('meta', 'social');
    if (row && row.value) SOCIAL_KEYS.forEach((k) => { if (row.value[k] !== undefined) social[k] = row.value[k]; });
  } catch (e) { /* sin datos previos */ }
  // lo guardado de versiones anteriores también pasa por la limpieza
  social.groups = (Array.isArray(social.groups) ? social.groups : []).map(S.sanitizeGroup).filter(Boolean);
  const boards = {};
  Object.keys(social.boards || {}).forEach((gid) => {
    const b = social.boards[gid];
    if (b && Array.isArray(b.rows)) boards[gid] = { at: b.at, rows: b.rows.map(S.sanitizeBoardRow).filter(Boolean) };
  });
  social.boards = boards;
  social.loaded = true;
}
async function socialSave() {
  const v = {};
  SOCIAL_KEYS.forEach((k) => { v[k] = social[k]; });
  try { await DB.put('meta', { key: 'social', value: v }); } catch (e) { /* se reintentará en el próximo cambio */ }
}
function socialReady() { return !!SOCIAL_CFG; }
function loggedIn() { return !!(social.session && social.session.access_token); }

// ---------------------------------------------------------------- errores legibles
const SOCIAL_ERRORS = {
  sin_sesion: 'Tu sesión ha caducado. Vuelve a entrar.',
  nombre_no_valido: 'El nombre debe tener entre 1 y 30 caracteres (40 para grupos).',
  resumen_no_valido: 'No se pudo preparar tu resumen.',
  resumen_demasiado_grande: 'Tu resumen es demasiado grande para compartirlo.',
  codigo_no_valido: 'Ese código de invitación no existe. Revisa las letras y números.',
  grupo_lleno: 'Ese grupo ya tiene 20 personas.',
  demasiados_grupos: 'Puedes estar como mucho en 10 grupos.',
  no_miembro: 'Ya no perteneces a ese grupo.',
};
class SocialError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
function authErrorText(j, status) {
  const raw = String((j && (j.msg || j.error_description || j.message || j.error)) || '').toLowerCase();
  const code = j && (j.error_code || j.code);
  if (code === 'invalid_credentials' || raw.includes('invalid login')) return 'Email o contraseña incorrectos.';
  if (code === 'user_already_exists' || raw.includes('already registered')) return 'Ya existe una cuenta con ese email. Entra con tu contraseña.';
  if (code === 'weak_password' || raw.includes('password should')) return 'La contraseña no cumple los requisitos del servidor: usa una más larga (al menos 8 caracteres).';
  if (code === 'email_not_confirmed' || raw.includes('not confirmed')) return 'Falta confirmar el email. En Supabase, desactiva «Confirm email» (Authentication → Sign In / Providers → Email) y vuelve a intentarlo.';
  if (code === 'validation_failed' || raw.includes('invalid format') || raw.includes('unable to validate email')) return 'Ese email no parece válido.';
  if (code === 'over_request_rate_limit' || code === 'over_email_send_rate_limit' || status === 429) return 'Demasiados intentos seguidos. Espera un minuto.';
  if (code === 'signup_disabled' || raw.includes('signups not allowed')) return 'El registro está desactivado en Supabase (Authentication → Sign In / Providers → Email → Allow new users to sign up).';
  return 'No se pudo completar (' + (raw || 'error ' + status) + ').';
}
function networkError() { return new SocialError('Sin conexión con el servidor. Tus entrenamientos se siguen guardando en el móvil.', 'offline'); }

// ---------------------------------------------------------------- llamadas HTTP
async function authCall(path, body, token) {
  let res;
  try {
    res = await fetch(SOCIAL_CFG.url + '/auth/v1/' + path, {
      method: 'POST',
      headers: Object.assign({ apikey: SOCIAL_CFG.key, 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}),
      body: JSON.stringify(body || {}),
    });
  } catch (e) { throw networkError(); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new SocialError(authErrorText(j, res.status), (j && (j.error_code || j.code)) || 'auth');
  return j;
}
function storeSession(j) {
  if (!j || !j.access_token) {
    throw new SocialError('La cuenta se ha creado pero Supabase pide confirmar el email. Desactiva «Confirm email» en Authentication → Sign In / Providers → Email y entra de nuevo.', 'email_not_confirmed');
  }
  social.session = {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600),
    user: { id: j.user && j.user.id, email: j.user && j.user.email },
  };
}
let refreshing = null;
async function refreshSession() {
  if (!social.session || !social.session.refresh_token) throw new SocialError(SOCIAL_ERRORS.sin_sesion, 'sin_sesion');
  if (!refreshing) {
    refreshing = authCall('token?grant_type=refresh_token', { refresh_token: social.session.refresh_token })
      .then((j) => { storeSession(j); return socialSave(); })
      .catch((e) => {
        if (e.code !== 'offline') { social.session = null; socialSave(); }
        throw e.code === 'offline' ? e : new SocialError(SOCIAL_ERRORS.sin_sesion, 'sin_sesion');
      })
      .finally(() => { refreshing = null; });
  }
  return refreshing;
}
async function rpc(name, args, retried) {
  if (!loggedIn()) throw new SocialError(SOCIAL_ERRORS.sin_sesion, 'sin_sesion');
  if (social.session.expires_at - 60 < Date.now() / 1000) await refreshSession();
  let res;
  try {
    res = await fetch(SOCIAL_CFG.url + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { apikey: SOCIAL_CFG.key, Authorization: 'Bearer ' + social.session.access_token, 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(args || {}),
    });
  } catch (e) { social.online = false; throw networkError(); }
  social.online = true;
  if (res.status === 401 && !retried) { await refreshSession(); return rpc(name, args, true); }
  const text = await res.text();
  let j = null;
  try { j = text ? JSON.parse(text) : null; } catch (e) { j = null; }
  if (!res.ok) {
    const msg = j && j.message ? String(j.message) : '';
    if (SOCIAL_ERRORS[msg]) {
      if (msg === 'sin_sesion') { social.session = null; socialSave(); }
      throw new SocialError(SOCIAL_ERRORS[msg], msg);
    }
    if (res.status === 404 || (j && j.code === 'PGRST202')) throw new SocialError('Falta instalar el script de GymTracker en Supabase (SQL Editor → Run).', 'missing_sql');
    throw new SocialError('El servidor ha respondido con un error (' + res.status + (msg ? ': ' + msg : '') + ').', 'server');
  }
  return j;
}

// ---------------------------------------------------------------- acciones de cuenta y grupos
async function socialSignUp(name, email, password) {
  storeSession(await authCall('signup', { email, password }));
  social.name = name;
  await socialSave();
  await socialPublish(true);
  await socialAfterLogin();
}
async function socialSignIn(email, password) {
  storeSession(await authCall('token?grant_type=password', { email, password }));
  await socialSave();
  await socialRefreshGroups();
  if (!social.name) {
    // cuenta creada en otro dispositivo: recupera el nombre desde los grupos
    for (const g of social.groups) {
      const b = await socialFetchBoard(g.id).catch(() => null);
      const me = b && b.rows.find((r) => r.is_me);
      if (me && me.display_name) { social.name = me.display_name; break; }
    }
  }
  await socialSave();
  if (social.name) await socialPublish(true);
  await socialAfterLogin();
}
async function socialAfterLogin() {
  if (social.pendingJoin) {
    const code = social.pendingJoin;
    social.pendingJoin = null;
    await socialSave();
    try { const g = await socialJoin(code); toast(`Te has unido a «${g.name}».`, 'good', 3500); }
    catch (e) { toast(e.message, 'err', 4500); }
  } else {
    await socialRefreshGroups();
  }
}
async function socialSignOut() {
  const token = social.session && social.session.access_token;
  social.session = null; social.groups = []; social.boards = {}; social.activeGroup = null; social.lastPublished = null;
  await socialSave();
  if (token) authCall('logout', {}, token).catch(() => {});
}
async function socialRefreshGroups() {
  const raw = await rpc('gt_my_groups', {});
  social.groups = (Array.isArray(raw) ? raw : []).map(S.sanitizeGroup).filter(Boolean);
  if (!social.groups.some((g) => g.id === social.activeGroup)) social.activeGroup = social.groups.length ? social.groups[0].id : null;
  await socialSave();
  return social.groups;
}
async function socialCreateGroup(name) {
  const g = S.sanitizeGroup(await rpc('gt_create_group', { p_name: name }));
  if (!g) throw new SocialError('Respuesta inesperada del servidor.', 'server');
  await socialPublish(true);
  await socialRefreshGroups();
  social.activeGroup = g.id;
  await socialSave();
  return g;
}
async function socialJoin(code) {
  const g = S.sanitizeGroup(await rpc('gt_join_group', { p_code: code }));
  if (!g) throw new SocialError('Respuesta inesperada del servidor.', 'server');
  await socialPublish(true);
  await socialRefreshGroups();
  social.activeGroup = g.id;
  await socialSave();
  await socialFetchBoard(g.id).catch(() => {});
  return g;
}
async function socialLeave(gid) {
  await rpc('gt_leave_group', { p_group: gid });
  delete social.boards[gid];
  await socialRefreshGroups();
}
async function socialDeleteMine() {
  await rpc('gt_delete_my_data', {});
  social.groups = []; social.boards = {}; social.activeGroup = null; social.lastPublished = null;
  social.share.enabled = false;
  await socialSave();
}
async function socialFetchBoard(gid) {
  const raw = await rpc('gt_board', { p_group: gid });
  const rows = (Array.isArray(raw) ? raw : []).map(S.sanitizeBoardRow).filter(Boolean);
  social.boards[gid] = { at: new Date().toISOString(), rows };
  await socialSave();
  return social.boards[gid];
}

// ---------------------------------------------------------------- publicar el resumen
function mySummary() {
  if (!social.share.enabled) return { v: S.SOCIAL_VERSION, hidden: true, generatedAt: new Date().toISOString() };
  return cached('social-summary:' + social.share.weights, () => S.buildSocialSummary(state.sessions,
    { exerciseName: exName, exerciseMuscles: exMuscles, exerciseGroup: exGroup }, new Date(), { weights: social.share.weights }));
}
function hashStr(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return String(h >>> 0); }
let publishTimer = null;
/** Publica el resumen si ha cambiado (o si han pasado 6 h, para mantener frescas las métricas semanales). */
async function socialPublish(force) {
  if (!socialReady() || !loggedIn() || !social.name) return false;
  const sm = mySummary();
  const body = JSON.stringify(Object.assign({}, sm, { generatedAt: undefined }));
  const h = hashStr(body + social.name);
  const stale = !social.lastPublished || Date.now() - new Date(social.lastPublished.at) > 6 * 3600e3;
  if (!force && social.lastPublished && social.lastPublished.hash === h && !stale) return false;
  await rpc('gt_publish', { p_name: social.name, p_summary: sm });
  social.lastPublished = { at: new Date().toISOString(), hash: h };
  await socialSave();
  return true;
}
/** Programa una publicación en segundo plano tras cambios en los entrenamientos. */
function socialDirty(delay = 8000) {
  if (!socialReady() || !loggedIn()) return;
  clearTimeout(publishTimer);
  publishTimer = setTimeout(() => { socialPublish(false).catch(() => {}); }, delay);
}
window.addEventListener('online', () => { social.online = true; socialDirty(1500); });
window.addEventListener('offline', () => { social.online = false; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) socialDirty(3000); });

/** Lee ?unirse=CODIGO de la dirección (enlace de invitación) y lo guarda para después de entrar. */
function readInviteFromURL() {
  try {
    const u = new URL(location.href);
    const code = (u.searchParams.get('unirse') || '').trim().toUpperCase();
    if (!code) return false;
    u.searchParams.delete('unirse');
    history.replaceState(null, '', u.pathname + (u.search || '') + '#amigos');
    social.pendingJoin = code.replace(/[^A-Z0-9]/g, '').slice(0, 12);
    return true;
  } catch (e) { return false; }
}
function inviteLink(code) {
  const u = new URL(location.href);
  u.hash = ''; u.search = '';
  u.searchParams.set('unirse', code);
  return u.toString();
}

/* GymTracker — entrenar: inicio de sesión, editor de sesión (activa o pasada) y resumen final. */

// ---------------------------------------------------------------- ayudas de sesión
function newSet(kind = 'normal') { return { id: uid(), weight: null, reps: null, kind, done: false }; }
function sessionsBefore(session) {
  const t = new Date(session.startedAt);
  return state.sessions.filter((x) => x.id !== session.id && x.status === 'done' && new Date(x.startedAt) < t);
}
/** Última ejecución previa del ejercicio: {session, sets (completadas, incluidas de calentamiento)} */
function previousExecution(session, exerciseId) {
  const key = 'prev:' + session.id + ':' + exerciseId + ':' + session.startedAt;
  return cached(key, () => {
    const hist = S.exerciseHistory(sessionsBefore(session), exerciseId);
    if (!hist.length) return null;
    const last = hist[hist.length - 1];
    const ps = sessionById(last.sessionId);
    const sets = ps.exercises.filter((e) => e.exerciseId === exerciseId).flatMap((e) => e.sets.filter((x) => x.done));
    return { session: ps, sets, hist: last };
  });
}
function bestsFor(session, exerciseId) {
  return cached('best:' + session.id + ':' + exerciseId + ':' + session.startedAt,
    () => S.bestsBefore(state.sessions.filter((x) => x.status === 'done'), exerciseId, session.startedAt, session.id));
}
/** Valores sugeridos (kg/reps) para una serie: la misma serie de la última vez o la serie anterior de hoy. */
function suggestion(session, entry, idx) {
  const cur = entry.sets[idx];
  if (entry.target && cur && cur.kind === 'normal') return { weight: entry.target.weight, reps: entry.target.reps, from: 'target' };
  const prev = previousExecution(session, entry.exerciseId);
  if (prev && prev.sets[idx]) return { weight: prev.sets[idx].weight, reps: prev.sets[idx].reps, from: 'prev' };
  for (let i = idx - 1; i >= 0; i--) {
    const s = entry.sets[i];
    if (s.weight != null || s.reps != null) return { weight: s.weight, reps: s.reps, from: 'same' };
  }
  return null;
}
function isPRSet(session, entry, set) {
  if (!S.isWorkSet(set)) return null;
  const b = bestsFor(session, entry.exerciseId);
  if (!b) return null;
  if (set.weight > b.weight) return 'weight';
  if (set.reps <= S.E1RM_MAX_REPS && b.e1rm > 0 && S.epley1RM(set.weight, set.reps) > b.e1rm + 1e-9) return 'e1rm';
  return null;
}
function startSession(type, from) {
  const cur = activeSession();
  if (cur) { go('entrenar'); toast('Ya tienes una sesión en marcha.'); return; }
  const s = {
    id: uid(), type, status: 'active', startedAt: new Date().toISOString(), endedAt: null, notes: '',
    exercises: [], createdAt: new Date().toISOString(),
  };
  if (from) {
    s.exercises = from.exercises.map((e) => ({
      id: uid(), exerciseId: e.exerciseId,
      sets: (e.sets.length ? e.sets : [newSet()]).map((x) => ({ id: uid(), weight: x.weight ?? null, reps: x.reps ?? null, kind: x.kind || 'normal', done: false })),
    }));
  }
  state.sessions.push(s);
  saveSession(s);
  flushSessions();
  state.route = { view: 'entrenar', sub: null };
  if (location.hash !== '#entrenar') history.replaceState(null, '', '#entrenar');
  render();
  if (state.settings.fun) toast(phrase('start'), 'good');
}

function exerciseCard(s, e, i) {
  const prev = previousExecution(s, e.exerciseId);
  const allDone = e.sets.length && e.sets.every((x) => x.done);
  const menuOpen = state.ui.openEntryMenu === e.id;
  let n = 0;
  const rows = e.sets.map((st, k) => {
    if (st.kind !== 'warmup') n++;
    return setRow(s, e, st, k, st.kind === 'warmup' ? 'C' : st.kind === 'drop' ? 'D' : String(n));
  }).join('');
  return `
  <article class="ex-card ${allDone ? 'complete' : ''}" id="entry-${e.id}">
    <div class="ex-head">
      <div style="flex:1;min-width:0">
        <button class="name" data-action="open-exercise" data-ex="${e.exerciseId}">${esc(exName(e.exerciseId))}</button>
        <div class="row" style="margin-top:4px">${S.MUSCLES.filter((m) => exMuscles(e.exerciseId)[m] === 1).map((m) => `<span class="tag">${esc(C.MUSCLE_SHORT[m])}</span>`).join('') || `<span class="tag">${esc(C.GROUP_LABELS[exGroup(e.exerciseId)] || 'Otro')}</span>`}</div>
      </div>
      <button class="more-btn" data-action="entry-menu" data-entry="${e.id}" aria-expanded="${menuOpen}" aria-label="Opciones de ${esc(exName(e.exerciseId))}">${ICON.more}</button>
    </div>
    ${menuOpen ? `<div class="set-actions" style="padding-left:14px">
      <button class="btn btn-sm" data-action="entry-move" data-entry="${e.id}" data-dir="-1" ${i === 0 ? 'disabled' : ''}>${ICON.up}Subir</button>
      <button class="btn btn-sm" data-action="entry-move" data-entry="${e.id}" data-dir="1" ${i === s.exercises.length - 1 ? 'disabled' : ''}>${ICON.down}Bajar</button>
      <button class="btn btn-sm btn-danger" data-action="entry-remove" data-entry="${e.id}">${ICON.trash}Quitar</button></div>` : ''}
    <p class="ex-last">${prev ? `Última vez (${fmtDate(prev.session.startedAt)}): <b>${prev.sets.map(fmtSet).join(' · ')}</b>` : 'Primera vez que registras este ejercicio.'}</p>
    ${progressionLine(s, e, allDone)}
    <div class="sets" role="group" aria-label="Series de ${esc(exName(e.exerciseId))}">
      <div class="set-hdr" aria-hidden="true"><span>Serie</span><span>Anterior</span><span>${unit()}</span><span>Reps</span><span>Hecha</span><span></span></div>
      ${rows}
    </div>
    <div class="ex-foot">
      <button class="btn btn-sm" data-action="add-set" data-entry="${e.id}">${ICON.plus}Serie</button>

function progressionLine(s, e, allDone) {
  const p = progressionFor(e.exerciseId, s);
  const st = s.status === 'active' ? stallFor(e.exerciseId) : null;
  if (!p && !st) return '';
  const t = progressionText(p);
  const applied = e.target && p && e.target.weight === p.weight && e.target.reps === p.reps;
  const cfg = progressionCfg(e.exerciseId);
  return `<div class="prog-line">
    ${t ? `<div class="grow"><span class="prog-title">${ICON.target}${esc(t.title)}</span>
      <span class="prog-reason">${esc(t.reason)} <span class="faint">Rango ${cfg.repMin}–${cfg.repMax}.</span></span></div>
      ${allDone ? '' : applied ? '<span class="tag tag-accent">Aplicada</span>' : `<button class="btn btn-sm" data-action="apply-target" data-entry="${e.id}">Usar</button>`}` : ''}
    ${st ? `<p class="stall-note">${ICON.pause}Sin mejorar tu mejor marca en ${plural(st.sessionsSince, 'sesión', 'sesiones')} (${st.daysSince} días). Un cambio de rango de repeticiones, una variante o una semana más suave pueden ayudar.</p>` : ''}
  </div>`;
}
function entryFootText(e) {
  const ws = S.workSets(e);
  return ws.length ? `${plural(ws.length, 'serie', 'series')} · ${fmtVol(S.entryVolume(e))}` : 'Volumen: —';
}
function setRow(s, e, st, k, label) {
  const sug = suggestion(s, e, k);
  const prev = previousExecution(s, e.exerciseId);
  const prevSet = prev && prev.sets[k];
  const pr = st.done ? isPRSet(s, e, st) : null;
  const err = state.ui.errors[st.id] || '';
  const menu = state.ui.openSetMenu === st.id;
  const kindName = C.KIND_LABELS[st.kind || 'normal'];
  const name = exName(e.exerciseId);
  return `
  <div class="set-row ${st.done ? 'done' : ''} ${pr ? 'pr-row' : ''} ${state.ui.flash === st.id ? 'flash' : ''}" id="row-${st.id}">
    <button class="kind-btn ${st.kind}" data-action="cycle-kind" data-entry="${e.id}" data-set="${st.id}" aria-label="Serie ${k + 1}, tipo ${kindName}. Cambiar tipo">${label}</button>
    <div class="prev-cell" title="${prevSet ? 'Misma serie la última vez' : ''}">${prevSet ? fmtSet(prevSet) : '—'}${pr ? ' <span class="tag tag-pr">PR</span>' : ''}</div>
    <input class="set-input" type="text" inputmode="decimal" autocomplete="off" id="w-${st.id}" data-field="weight" data-entry="${e.id}" data-set="${st.id}"
      value="${inputValue(st.weight)}" placeholder="${sug && sug.weight != null ? esc(wNum(sug.weight)) : unit()}" aria-label="Peso en ${unit()}, serie ${k + 1} de ${esc(name)}" ${err.startsWith('Peso') || err.includes('peso') ? 'aria-invalid="true"' : ''}>
    <input class="set-input" type="text" inputmode="numeric" autocomplete="off" id="r-${st.id}" data-field="reps" data-entry="${e.id}" data-set="${st.id}"
      value="${st.reps ?? ''}" placeholder="${sug && sug.reps != null ? sug.reps : 'reps'}" aria-label="Repeticiones, serie ${k + 1} de ${esc(name)}" ${err.toLowerCase().includes('repetic') ? 'aria-invalid="true"' : ''}>
    <button class="check-btn ${state.ui.flash === st.id ? 'pop' : ''}" data-action="toggle-done" data-entry="${e.id}" data-set="${st.id}" aria-pressed="${st.done}" aria-label="${st.done ? 'Marcar como pendiente' : 'Marcar como completada'} la serie ${k + 1}">${ICON.check}</button>
    <button class="more-btn" data-action="set-menu" data-set="${st.id}" aria-expanded="${menu}" aria-label="Más opciones de la serie ${k + 1}">${ICON.more}</button>
  </div>
  <div class="set-err" id="err-${st.id}" role="alert" ${err ? '' : 'hidden'}>${esc(err)}</div>
  ${menu ? `<div class="set-actions">
    <button class="btn btn-sm" data-action="set-dup" data-entry="${e.id}" data-set="${st.id}">${ICON.duplicate}Duplicar</button>
    <button class="btn btn-sm" data-action="set-move" data-entry="${e.id}" data-set="${st.id}" data-dir="-1" ${k === 0 ? 'disabled' : ''}>${ICON.up}Subir</button>
    <button class="btn btn-sm" data-action="set-move" data-entry="${e.id}" data-set="${st.id}" data-dir="1" ${k === e.sets.length - 1 ? 'disabled' : ''}>${ICON.down}Bajar</button>
    <button class="btn btn-sm btn-danger" data-action="set-remove" data-entry="${e.id}" data-set="${st.id}">${ICON.trash}Eliminar</button>
  </div>` : ''}`;
}

function findEntry(s, entryId) { return s.exercises.find((e) => e.id === entryId); }
function findSet(s, entryId, setId) { const e = findEntry(s, entryId); return e ? [e, e.sets.find((x) => x.id === setId)] : [null, null]; }

/** Lee y valida un campo de serie. Devuelve {value, error}. */
function readSetField(field, raw) {
  if (raw.trim() === '') return { value: null, error: null };
  const n = S.parseNum(raw);
  if (field === 'weight') {
    if (Number.isNaN(n)) return { value: null, error: 'Peso no válido: usa números, por ejemplo 72,5' };
    const kg = fromUnit(n);
    const err = S.validateWeight(kg);
    return err ? { value: null, error: err } : { value: S.round(kg, 4), error: null };
  }
  if (Number.isNaN(n)) return { value: null, error: 'Repeticiones no válidas: usa un número entero' };
  const err = S.validateReps(n);
  return err ? { value: null, error: err } : { value: n, error: null };
}
function onSetInput(el) {
  const s = editingSession();
  if (!s) return;
  const [entry, set] = findSet(s, el.dataset.entry, el.dataset.set);
  if (!set) return;
  const field = el.dataset.field;
  const { value, error } = readSetField(field, el.value);
  const other = field === 'weight' ? 'reps' : 'weight';
  const otherEl = document.getElementById((other === 'weight' ? 'w-' : 'r-') + set.id);
  const otherErr = otherEl ? readSetField(other, otherEl.value).error : null;
  const msg = error || otherErr || '';
  if (msg) state.ui.errors[set.id] = msg; else delete state.ui.errors[set.id];
  el.setAttribute('aria-invalid', error ? 'true' : 'false');
  const errEl = document.getElementById('err-' + set.id);
  if (errEl) { errEl.textContent = msg; errEl.hidden = !msg; }
  if (error) return; // no se guarda un valor inválido
  set[field] = value;
  if (set.done && (set.weight == null || set.reps == null)) set.done = false;
  saveSession(s);
  const vol = document.getElementById('vol-' + entry.id);
  if (vol) vol.textContent = entryFootText(entry);
}
function onSessField(el) {
  const s = editingSession();
  if (!s) return;
  const f = el.dataset.sess;
  if (f === 'notes') { s.notes = el.value.slice(0, 2000); saveSession(s); return; }
  if (f === 'type') { s.type = el.value; saveSession(s); render(); return; }
  if (f === 'start' || f === 'end') {
    const d = new Date(el.value);
    if (Number.isNaN(+d)) { toast('Fecha no válida.', 'err'); return; }
    if (f === 'start') {
      if (s.endedAt && d >= new Date(s.endedAt)) { toast('El inicio debe ser anterior al fin.', 'err'); el.value = toLocalInput(s.startedAt); return; }
      if (s.status === 'active' && d > new Date()) { toast('El inicio no puede estar en el futuro.', 'err'); el.value = toLocalInput(s.startedAt); return; }
      s.startedAt = d.toISOString();
    } else {
      if (d <= new Date(s.startedAt)) { toast('El fin debe ser posterior al inicio.', 'err'); el.value = toLocalInput(s.endedAt); return; }
      s.endedAt = d.toISOString();
    }
    saveSession(s); render();
  }
}

const TrainActions = {
  'start': (el) => startSession(el.dataset.type),
  'start-copy': (el) => { const src = sessionById(el.dataset.id); if (src) startSession(src.type, src); },
  'add-exercise': () => openExercisePicker((exId) => {
    const s = editingSession();
    const prev = previousExecution(s, exId);
    const count = prev ? Math.max(1, prev.sets.length) : 3;
    const entry = { id: uid(), exerciseId: exId, sets: Array.from({ length: count }, (_, k) => newSet(prev && prev.sets[k] ? prev.sets[k].kind || 'normal' : 'normal')) };
    s.exercises.push(entry);
    saveSession(s); render();
    const first = document.getElementById('w-' + entry.sets[0].id);
    const card = document.getElementById('entry-' + entry.id);
    if (card) card.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
    if (first && matchMedia('(pointer: fine)').matches) first.focus({ preventScroll: true });
  }),
  'add-set': (el) => {
    const s = editingSession();
    const e = findEntry(s, el.dataset.entry);
    const last = e.sets[e.sets.length - 1];
    const ns = newSet(last && last.kind === 'drop' ? 'drop' : 'normal');
    e.sets.push(ns);
    saveSession(s); render();
    const inp = document.getElementById('w-' + ns.id);
    if (inp && matchMedia('(pointer: fine)').matches) inp.focus();
  },
  'cycle-kind': (el) => {
    const s = editingSession();
    const [, set] = findSet(s, el.dataset.entry, el.dataset.set);
    const order = S.SET_KINDS;
    set.kind = order[(order.indexOf(set.kind || 'normal') + 1) % order.length];
    saveSession(s); render();
    toast('Tipo de serie: ' + C.KIND_LABELS[set.kind], '', 1400);
  },
  'toggle-done': (el) => {
    const s = editingSession();
    const [entry, set] = findSet(s, el.dataset.entry, el.dataset.set);
    if (!set) return;
    if (set.done) { set.done = false; saveSession(s); render(); return; }
    // si hay campos vacíos se rellenan con la sugerencia mostrada
    const idx = entry.sets.indexOf(set);
    const sug = suggestion(s, entry, idx);
    const wEl = document.getElementById('w-' + set.id), rEl = document.getElementById('r-' + set.id);
    if (wEl && wEl.value.trim() !== '') { const r = readSetField('weight', wEl.value); if (r.error) { flagErr(set, r.error); return; } set.weight = r.value; }
    if (rEl && rEl.value.trim() !== '') { const r = readSetField('reps', rEl.value); if (r.error) { flagErr(set, r.error); return; } set.reps = r.value; }
    if (set.weight == null && sug && sug.weight != null) set.weight = sug.weight;
    if (set.reps == null && sug && sug.reps != null) set.reps = sug.reps;
    if (set.weight == null) { flagErr(set, 'Escribe el peso (0 si es con peso corporal).'); return; }
    if (set.reps == null || set.reps === 0) { flagErr(set, 'Escribe cuántas repeticiones has hecho.'); return; }
    delete state.ui.errors[set.id];
    set.done = true;
    state.ui.flash = set.id;
    saveSession(s);
    const pr = isPRSet(s, entry, set);
    const othersBest = entry.sets.filter((x) => x !== set && S.isWorkSet(x));
    const beatsToday = othersBest.every((x) => set.weight > x.weight || S.epley1RM(set.weight, set.reps) > S.epley1RM(x.weight, x.reps));
    render();
    state.ui.flash = null;
    if (pr && beatsToday) {
      toast((state.settings.fun ? phrase('pr') + ' ' : 'Nuevo récord: ') + (pr === 'weight' ? `${exName(entry.exerciseId)}: ${fmtW(set.weight)}` : `${exName(entry.exerciseId)}: 1RM estimado ${fmtW(S.epley1RM(set.weight, set.reps), 1)}`), 'pr', 3600);
    } else if (state.settings.fun && Math.random() < 0.35) {
      toast(phrase('set'), '', 2000);
    }
  },
  'apply-target': (el) => {
    const s = editingSession(); const e = findEntry(s, el.dataset.entry);
    const p = progressionFor(e.exerciseId, s);
    if (!p) return;
    e.target = { weight: p.weight, reps: p.reps };
    saveSession(s); render();
    toast(`Objetivo: ${fmtW(p.weight)} × ${p.reps}. Al marcar una serie vacía se usa este objetivo.`, '', 2600);
  },
  'set-menu': (el) => { state.ui.openSetMenu = state.ui.openSetMenu === el.dataset.set ? null : el.dataset.set; render(); },
  'entry-menu': (el) => { state.ui.openEntryMenu = state.ui.openEntryMenu === el.dataset.entry ? null : el.dataset.entry; render(); },
  'set-dup': (el) => {
    const s = editingSession(); const [e, set] = findSet(s, el.dataset.entry, el.dataset.set);
    const copy = Object.assign({}, set, { id: uid(), done: false });
    e.sets.splice(e.sets.indexOf(set) + 1, 0, copy);
    state.ui.openSetMenu = null; saveSession(s); render();
  },
  'set-move': (el) => {
    const s = editingSession(); const [e, set] = findSet(s, el.dataset.entry, el.dataset.set);
    const i = e.sets.indexOf(set), j = i + Number(el.dataset.dir);
    if (j < 0 || j >= e.sets.length) return;
    e.sets.splice(i, 1); e.sets.splice(j, 0, set);
    saveSession(s); render();
  },
  'set-remove': (el) => {
    const s = editingSession(); const [e, set] = findSet(s, el.dataset.entry, el.dataset.set);
    e.sets.splice(e.sets.indexOf(set), 1);
    delete state.ui.errors[set.id];
    state.ui.openSetMenu = null; saveSession(s); render();
    toast('Serie eliminada.', '', 1600);
  },
  'entry-move': (el) => {
    const s = editingSession(); const e = findEntry(s, el.dataset.entry);
    const i = s.exercises.indexOf(e), j = i + Number(el.dataset.dir);
    if (j < 0 || j >= s.exercises.length) return;
    s.exercises.splice(i, 1); s.exercises.splice(j, 0, e);
    saveSession(s); render();
  },
  'entry-remove': async (el) => {
    const s = editingSession(); const e = findEntry(s, el.dataset.entry);
    if (e.sets.some((x) => x.done)) {
      const ok = await confirmModal({ title: 'Quitar ejercicio', text: `${esc(exName(e.exerciseId))} tiene series completadas. Si lo quitas, se borran de esta sesión.`, confirmLabel: 'Quitar', danger: true });
      if (!ok) return;
    }
    s.exercises.splice(s.exercises.indexOf(e), 1);
    state.ui.openEntryMenu = null; saveSession(s); render();
  },
  'finish': async () => {
    const s = activeSession();
    if (!s) return;
    const doneSets = S.sessionWorkSetCount(s);
    const pending = s.exercises.reduce((a, e) => a + e.sets.filter((x) => !x.done && (x.weight != null || x.reps != null)).length, 0);
    if (!doneSets) {
      const ok = await confirmModal({ title: 'Sesión sin series', text: 'No has marcado ninguna serie de trabajo como completada. Puedes seguir registrando o terminarla igualmente; no sumará volumen ni récords.', confirmLabel: 'Terminar igualmente', cancelLabel: 'Seguir entrenando' });
      if (!ok) return;
    } else if (pending) {
      const ok = await confirmModal({ title: 'Terminar sesión', text: `Hay ${plural(pending, 'serie con datos sin marcar', 'series con datos sin marcar')} como completada. Se guardarán como pendientes y no contarán en las estadísticas.`, confirmLabel: 'Terminar', cancelLabel: 'Revisar' });
      if (!ok) return;
    }
    const before = S.evaluateAchievements(state.sessions, exGroup).list.filter((a) => a.unlocked).map((a) => a.id);
    // se eliminan las series completamente vacías
    s.exercises.forEach((e) => { e.sets = e.sets.filter((x) => x.done || x.weight != null || x.reps != null); });
    s.status = 'done';
    s.endedAt = new Date().toISOString();
    saveSession(s);
    await flushSessions();
    socialDirty(1500);
    const after = S.evaluateAchievements(state.sessions, exGroup).list.filter((a) => a.unlocked && !before.includes(a.id));
    state.ui.summary = { id: s.id, phrase: phrase('finish'), newAch: after.map((a) => a.id) };
    state.ui.errors = {};
    state.route = { view: 'entrenar', sub: { summaryId: s.id } };
    render();
    window.scrollTo(0, 0);
    if (prEvents().some((p) => p.sessionId === s.id && p.type !== 'volume')) confetti();
  },
  'discard': async () => {
    const s = activeSession();
    const ok = await confirmModal({ title: 'Descartar sesión', text: 'Se borrará esta sesión en curso con todas sus series. No se puede deshacer.', confirmLabel: 'Descartar', danger: true });
    if (!ok) return;
    await removeSession(s.id);
    state.route = { view: 'entrenar', sub: null };
    render();
    toast('Sesión descartada.');
  },
  'edit-done': async () => {
    const s = editingSession();
    await flushSessions();
    state.route = { view: 'historial', sub: { sessionId: s.id } };
    render(); window.scrollTo(0, 0);
  },
};
function flagErr(set, msg) {
  state.ui.errors[set.id] = msg;
  const errEl = document.getElementById('err-' + set.id);
  if (errEl) { errEl.textContent = msg; errEl.hidden = false; }
}
async function removeSession(id) {
  pendingSessions.delete(id);
  try { await DB.del('sessions', id); } catch (e) { toast('No se pudo borrar del almacenamiento.', 'err'); return; }
  state.sessions = state.sessions.filter((s) => s.id !== id);
  bump();
  socialDirty();
}

// ---------------------------------------------------------------- selector de ejercicios
function openExercisePicker(onPick) {
  const s = editingSession();
  const defGroup = s && S.GROUPS.includes(s.type) ? s.type : '';
  let group = defGroup;
  let q = '';
  const body = `
    <label class="field" for="pick-q"><span class="sr-only">Buscar ejercicio</span>
      <input class="input" id="pick-q" type="search" placeholder="Buscar o escribir un ejercicio nuevo" autocomplete="off"></label>
    <div class="chips" id="pick-groups"></div>
    <div class="pick-list" id="pick-list"></div>
    <div id="pick-create"></div>`;
  openModal({
    title: 'Añadir ejercicio', body,
    onOpen: (root, close) => {
      const list = $('#pick-list', root), groups = $('#pick-groups', root), create = $('#pick-create', root), qi = $('#pick-q', root);
      const draw = () => {
        groups.innerHTML = [['', 'Todos'], ['fav', 'Favoritos']].concat(S.GROUPS.map((g) => [g, C.GROUP_LABELS[g]]))
          .map(([g, l]) => `<button class="chip" data-g="${g}" aria-pressed="${group === g}">${esc(l)}</button>`).join('');
        const nq = S.normName(q);
        const inSession = new Set((s ? s.exercises : []).map((e) => e.exerciseId));
        let items = state.exercises.filter((e) => !e.archived);
        if (group === 'fav') items = items.filter((e) => e.favorite);
        else if (group && !nq) items = items.filter((e) => e.group === group);
        if (nq) items = items.filter((e) => S.normName(e.name).includes(nq));
        const used = cached('usage', () => { const m = {}; done().forEach((x) => x.exercises.forEach((e) => { m[e.exerciseId] = (m[e.exerciseId] || 0) + 1; })); return m; });
        items.sort((a, b) => (b.favorite - a.favorite) || ((used[b.id] || 0) - (used[a.id] || 0)) || a.name.localeCompare(b.name, 'es'));
        list.innerHTML = items.length ? items.map((e) => `
          <button class="pick-item" data-pick="${e.id}">
            <span class="star" aria-hidden="true" style="width:20px">${e.favorite ? ICON.starFill : ''}</span>
            <span class="grow"><span style="font-weight:600">${esc(e.name)}</span><br><span class="muted small">${esc(C.GROUP_LABELS[e.group])}${used[e.id] ? ' · ' + plural(used[e.id], 'sesión', 'sesiones') : ''}</span></span>
            ${inSession.has(e.id) ? '<span class="tag">En la sesión</span>' : ''}
          </button>`).join('') : `<p class="muted" style="padding:8px">No hay ejercicios con ese nombre.</p>`;
        const exact = state.exercises.some((e) => S.normName(e.name) === nq);
        create.innerHTML = q.trim() && !exact ? `
          <div class="row" style="border-top:1px solid var(--line);padding-top:12px">
            <span class="grow" style="flex:1;min-width:140px">Crear «<b>${esc(q.trim())}</b>»</span>
            <label class="sr-only" for="pick-new-group">Grupo muscular</label>
            <select class="input" id="pick-new-group" style="width:auto">${S.GROUPS.map((g) => `<option value="${g}" ${g === (defGroup || 'otro') ? 'selected' : ''}>${esc(C.GROUP_LABELS[g])}</option>`).join('')}</select>
            <button class="btn btn-primary" data-create>${ICON.plus}Crear</button>
          </div>` : '';
      };
      draw();
      qi.addEventListener('input', () => { q = qi.value; draw(); });
      // El manejador va en la ventana de este modal (se destruye al cerrarla), no en #modal-root,
      // que es permanente: así no se acumulan manejadores entre aperturas.
      let picked = false;
      $('.modal', root).addEventListener('click', async (ev) => {
        if (picked) return;
        const g = ev.target.closest('[data-g]');
        if (g) { group = g.dataset.g; draw(); return; }
        const p = ev.target.closest('[data-pick]');
        if (p) { picked = true; close(); onPick(p.dataset.pick); return; }
        if (ev.target.closest('[data-create]')) {
          picked = true;
          const ex = { id: 'ex-' + uid(), name: q.trim().slice(0, 80), group: $('#pick-new-group', root).value, custom: true, favorite: false, createdAt: new Date().toISOString() };
          state.exercises.push(ex);
          await saveExercise(ex);
          close(); onPick(ex.id);
          toast('Ejercicio creado: ' + ex.name + '. Asigna sus músculos desde su ficha para afinar el mapa.', '', 3600);
        }
      });
    },
  });
}

// ---------------------------------------------------------------- resumen final
function viewSummary(id) {
  const s = sessionById(id);
  if (!s) return viewTrainStart();
  const sm = state.ui.summary && state.ui.summary.id === id ? state.ui.summary : { phrase: '', newAch: [] };
  const prs = prEvents().filter((p) => p.sessionId === id);
  const strengthPRs = prs.filter((p) => p.type !== 'volume');
  const prevSame = done().filter((x) => x.type === s.type && new Date(x.startedAt) < new Date(s.startedAt)).slice(-1)[0];
  const cmp = prevSame ? S.compareSessions(prevSame, s) : null;
  const achList = S.ACHIEVEMENTS.filter((a) => sm.newAch.includes(a.id));
  return `
  <section class="summary-hero ${strengthPRs.length ? 'has-pr' : ''}">
    <p class="eyebrow">Sesión terminada · ${esc(fmtDateLong(s.startedAt))}</p>
    <h1>${esc(C.TYPE_LABELS[s.type])}</h1>
    ${state.settings.fun && sm.phrase ? `<p class="quip">${esc(sm.phrase)}</p>` : ''}
  </section>
  <div class="grid grid-tiles">
    ${tile('Duración', fmtDur(S.durationMinutes(s)), `${fmtTime(s.startedAt)} – ${s.endedAt ? fmtTime(s.endedAt) : '—'}`)}
    ${tile('Ejercicios', s.exercises.length, '')}
    ${tile('Series de trabajo', S.sessionWorkSetCount(s), 'sin calentamiento')}
    ${tile('Volumen', nf(toUnit(S.sessionVolume(s)), 0), unit() + ' · peso × reps', )}
  </div>
  ${strengthPRs.length || prs.length ? `<section class="card"><div class="card-head"><h2>Récords de hoy</h2></div><div class="stack">${prs.map(prItemHTML).join('')}</div></section>` : ''}
  ${achList.length && state.settings.fun ? `<section class="card"><div class="card-head"><h2>Logros desbloqueados</h2></div><div class="ach-grid">${achList.map((a) => achHTML(Object.assign({ unlocked: true }, a))).join('')}</div></section>` : ''}
  <section class="card">
    <div class="card-head"><h2>Comparado con la vez anterior</h2></div>
    ${s.exercises.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>Ejercicio</th><th>Mejor serie</th><th class="r">Volumen</th><th class="r">Cambio de volumen</th></tr></thead><tbody>
      ${uniqueExercises(s).map((exId) => {
        const c = S.compareWithPrevious(state.sessions, s, exId);
        const ws = s.exercises.filter((e) => e.exerciseId === exId).flatMap(S.workSets);
        const top = ws.length ? S.topSet(ws) : null;
        return `<tr><td>${esc(exName(exId))}</td><td>${top ? fmtSet(top) : '—'}${c && c.totals.topWeight.before ? ` <span class="small muted">antes ${wNum(c.totals.topWeight.before)}</span>` : ''}</td>
          <td class="r">${fmtVol(ws.reduce((a, x) => a + x.weight * x.reps, 0))}</td>
          <td class="r">${c ? deltaHTML(c.totals.volume.diff, 'vol', c.totals.volume.pct) + `<br><span class="small muted">vs ${fmtDate(c.previousDate)}</span>` : '<span class="muted small">primera vez</span>'}</td></tr>`;
      }).join('')}</tbody></table></div>` : '<p class="muted">Sin ejercicios registrados.</p>'}
    ${cmp ? `<p class="small muted" style="margin-top:10px">Sesión completa frente a ${esc(C.TYPE_SHORT[s.type])} del ${fmtDate(prevSame.startedAt)}: volumen ${deltaHTML(cmp.totals.volume.diff, 'vol', cmp.totals.volume.pct)}, series ${deltaHTML(cmp.totals.sets.diff)}. Más volumen no significa por sí solo más progreso.</p>` : ''}
  </section>
  <div class="row">
    <button class="btn btn-primary" data-action="open-session" data-id="${s.id}">Ver sesión completa</button>
    <button class="btn" data-action="nav" data-view="inicio">Ir al inicio</button>
  </div>`;
}
function uniqueExercises(s) { const ids = []; s.exercises.forEach((e) => { if (!ids.includes(e.exerciseId)) ids.push(e.exerciseId); }); return ids; }
function prItemHTML(p) {
  const what = p.type === 'weight' ? `Peso máximo: <b>${fmtW(p.value)}</b> × ${p.reps} <span class="muted small">(antes ${fmtW(p.previous)})</span>`
    : p.type === 'e1rm' ? `1RM estimado: <b>${fmtW(p.value, 1)}</b> <span class="muted small">(antes ${fmtW(p.previous, 1)}; estimación Epley)</span>`
      : `Récord de volumen: <b>${fmtVol(p.value)}</b> <span class="muted small">(antes ${fmtVol(p.previous)})</span>`;
  return `<div class="pr-item">${ICON.trophy}<div><b>${esc(exName(p.exerciseId))}</b> · <span class="small muted">${fmtDate(p.date)}</span><br><span class="small">${what}</span></div></div>`;
}
function tile(label, big, foot) {
  return `<div class="tile"><span class="eyebrow">${esc(label)}</span><span class="big">${big}</span>${foot ? `<span class="foot">${foot}</span>` : ''}</div>`;
}

/* GymTracker — inicio, historial, progreso y ejercicios. */

function nextRoutineType() {
  const r = state.settings.routine || [];

  if (!last) return r[0];

  return i === -1 ? r[0] : r[(i + 1) % r.length];

function sessionListItem(s) {
  const d = new Date(s.startedAt);
  const hasPR = prEvents().some((p) => p.sessionId === s.id && p.type !== 'volume');

}
/** Puntos semanales de volumen para gráficos de barras. */
function weeklyVolumePoints(period) {
  const ds = done();
  if (!ds.length) return [];
  const now = new Date();
  const from = S.periodStart(period, now) || new Date(ds[0].startedAt);
  const firstData = new Date(ds[0].startedAt);
  const start = from < firstData ? firstData : from;
  return S.weeklySeries(state.sessions, start, now, exGroup).map((w) => {
    const d = new Date(w.key + 'T00:00:00');
    return {
      x: d, y: toUnit(w.volume), xl: fmtDate(d),
      tip: `Semana del <b>${fmtDate(d)}</b><br>${fmtVol(w.volume)} · ${plural(w.sessions, 'sesión', 'sesiones')} · ${plural(w.workSets, 'serie', 'series')}`,
    };
  });
}
function topExercises(period, n) {
  const count = {};
  done().filter((s) => S.inPeriod(s.startedAt, period)).forEach((s) => {
    new Set(s.exercises.filter((e) => S.workSets(e).length).map((e) => e.exerciseId)).forEach((id) => { count[id] = (count[id] || 0) + 1; });
  });
  return Object.keys(count).sort((a, b) => count[b] - count[a]).slice(0, n).map((id) => ({ id, count: count[id] }));
}
function metricPoints(exId, metric, period) {
  const hist = S.exerciseHistory(state.sessions, exId).filter((h) => S.inPeriod(h.date, period));
  return hist.filter((h) => metric !== 'e1rm' || h.e1rm > 0).map((h) => {
    const v = metric === 'weight' ? toUnit(h.topWeight) : metric === 'e1rm' ? toUnit(h.e1rm) : metric === 'reps' ? h.totalReps : toUnit(h.volume);
    const label = metric === 'weight' ? `Peso máximo: <b>${fmtW(h.topWeight)}</b> × ${h.topSet.reps}`
      : metric === 'e1rm' ? `1RM estimado: <b>${fmtW(h.e1rm, 1)}</b>`
        : metric === 'reps' ? `Repeticiones totales: <b>${h.totalReps}</b> en ${plural(h.sets.length, 'serie', 'series')}`
          : `Volumen: <b>${fmtVol(h.volume)}</b>`;
    return { x: new Date(h.date), y: v, xl: fmtDate(h.date), tip: `${fmtDate(h.date)}<br>${label}` };
  });
}
const METRICS = { weight: 'Peso máximo', e1rm: '1RM estimado', reps: 'Reps totales', volume: 'Volumen' };
function metricUnit(m) { return m === 'reps' ? 'reps' : unit(); }

// ---------------------------------------------------------------- historial
function filteredSessions() {
  const f = state.ui.hist;
  const nq = S.normName(f.q);
  return done().slice().reverse().filter((s) => {
    const d = S.dayKey(s.startedAt);
    if (f.from && d < f.from) return false;
    if (f.to && d > f.to) return false;
    if (f.type && s.type !== f.type) return false;
    if (f.ex && !s.exercises.some((e) => e.exerciseId === f.ex)) return false;
    if (nq && !s.exercises.some((e) => S.normName(exName(e.exerciseId)).includes(nq)) && !S.normName(s.notes).includes(nq)) return false;
    return true;
  });
}

    <label class="field" for="hf-to">Hasta<input class="input" type="date" id="hf-to" data-hist="to" value="${f.to}"></label>
  </div>${anyFilter ? `<div class="row spread" style="margin-top:10px"><span class="small muted">${plural(list.length, 'sesión', 'sesiones')} con estos filtros</span><button class="btn btn-sm btn-ghost" data-action="hist-clear">Quitar filtros</button></div>` : ''}</section>
  <section class="card" style="padding:4px 12px" id="hist-list">${list.length ? `<div class="list">${list.map(sessionListItem).join('')}</div>` : `<p class="muted" style="padding:14px 4px">Ninguna sesión coincide con los filtros.</p>`}</section>`;

function viewCalendar() {
  const act = S.dailyActivity(state.sessions);
  const month = state.ui.calMonth || S.startOfMonth(new Date());
  const first = S.startOfMonth(month);
  const gridStart = S.startOfWeek(first);
  const todayK = S.dayKey(new Date());
  const days = [];
  for (let i = 0; i < 42; i++) {
    const d = S.addDays(gridStart, i);
    if (i >= 35 && d.getMonth() !== first.getMonth()) break;
    const k = S.dayKey(d), a = act[k];
    const out = d.getMonth() !== first.getMonth();
    const label = `${DF.long.format(d)}${a ? ': ' + plural(a.sessions, 'sesión', 'sesiones') + ' (' + a.types.map((t) => C.TYPE_SHORT[t]).join(', ') + ')' : ''}`;
    days.push(a ? `<button class="day trained ${out ? 'out' : ''} ${k === todayK ? 'today' : ''}" data-action="cal-day" data-day="${k}" aria-label="${esc(label)}">${d.getDate()}<span class="dots">${'<i></i>'.repeat(Math.min(3, a.sessions))}</span></button>`
      : `<div class="day ${out ? 'out' : ''} ${k === todayK ? 'today' : ''}" aria-label="${esc(label)}">${d.getDate()}</div>`);
  }
  // mapa de constancia: últimas 53 semanas
  const maxSets = Math.max(1, ...Object.values(act).map((a) => a.workSets));
  const endW = S.startOfWeek(new Date());
  const startW = S.addDays(endW, -52 * 7);
  const cols = [];
  let lastMonth = -1;
  for (let w = 0; w < 53; w++) {
    const ws = S.addDays(startW, w * 7);
    const mLabel = ws.getMonth() !== lastMonth && ws.getDate() <= 7 ? DF.monthShort.format(ws).replace('.', '') : '';
    if (mLabel) lastMonth = ws.getMonth();
    cols.push(`<span class="mo">${mLabel}</span>`);
    for (let d = 0; d < 7; d++) {
      const day = S.addDays(ws, d);
      const k = S.dayKey(day), a = act[k];
      if (day > new Date()) { cols.push('<span class="c future"></span>'); continue; }
      const lvl = a ? S.intensityLevel(a.workSets, maxSets) : 0;
      cols.push(`<span class="c ${lvl ? 'l' + lvl : ''}" title="${esc(fmtDate(day) + (a ? ': ' + plural(a.workSets, 'serie', 'series') + ', ' + fmtVol(a.volume) : ': sin entrenar'))}"></span>`);
    }
  }
  return `
  <section class="card"><div class="card-head"><h2>Mapa de constancia</h2><span class="small muted">Últimas 53 semanas · intensidad según series de trabajo del día</span></div>
    <div class="heat-wrap"><div class="heat" role="img" aria-label="Mapa de constancia del último año">${cols.join('')}</div></div>
    <div class="heat-legend">Menos <span class="c" style="background:var(--surface-2)"></span><span class="c" style="background:var(--heat-1)"></span><span class="c" style="background:var(--heat-2)"></span><span class="c" style="background:var(--heat-3)"></span><span class="c" style="background:var(--heat-4)"></span> Más · máximo del día: ${plural(maxSets, 'serie', 'series')}</div></section>
  <section class="card"><div class="card-head">
    <button class="btn btn-ghost icon-btn" data-action="cal-nav" data-dir="-1" aria-label="Mes anterior">${ICON.back}</button>
    <h2>${esc(cap(DF.month.format(first)))}</h2>
    <button class="btn btn-ghost icon-btn" data-action="cal-nav" data-dir="1" aria-label="Mes siguiente" style="transform:scaleX(-1)">${ICON.back}</button></div>
    <div class="cal">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((d) => `<span class="dow">${d}</span>`).join('')}${days.join('')}</div>
    <p class="small muted" style="margin-top:10px">${(() => { const sum = S.windowSummary(state.sessions, first, S.addMonths(first, 1)); return `${plural(sum.sessions, 'sesión', 'sesiones')} este mes · ${plural(sum.workSets, 'serie', 'series')} · ${fmtVol(sum.volume)}`; })()}</p></section>`;
}
function viewPeriodSummary() {
  const now = new Date();
  const weeks = S.weeklySeries(state.sessions, S.addDays(S.startOfWeek(now), -7 * 11), now, exGroup).reverse();
  const monthsAgg = new Map(S.aggregate(state.sessions, 'month', exGroup).map((m) => [m.key, m]));
  const months = [];
  for (let i = 0; i < 12; i++) {
    const d = S.addMonths(S.startOfMonth(now), -i);
    const k = S.monthKey(d);
    months.push(Object.assign({ d }, monthsAgg.get(k) || { sessions: 0, workSets: 0, volume: 0, minutes: 0, byGroup: {} }));
  }
  const groupsLine = (bg) => Object.keys(bg).filter((g) => bg[g] > 0).sort((a, b) => bg[b] - bg[a]).map((g) => C.GROUP_LABELS[g]).slice(0, 3).join(', ') || '—';
  return `
  <section class="card"><div class="card-head"><h2>Resumen semanal</h2><span class="small muted">Últimas 12 semanas</span></div>
    <div class="table-wrap"><table class="data"><thead><tr><th>Semana</th><th class="r">Sesiones</th><th class="r">Series</th><th class="r">Volumen</th><th class="r">Tiempo</th><th>Grupos con más volumen</th></tr></thead><tbody>
    ${weeks.map((w) => `<tr><td>${fmtDate(w.key + 'T00:00:00')}</td><td class="r">${w.sessions}</td><td class="r">${w.workSets}</td><td class="r">${fmtVol(w.volume)}</td><td class="r">${fmtDur(w.minutes)}</td><td>${esc(groupsLine(w.byGroup))}</td></tr>`).join('')}
    </tbody></table></div></section>
  <section class="card"><div class="card-head"><h2>Resumen mensual</h2><span class="small muted">Últimos 12 meses</span></div>
    <div class="table-wrap"><table class="data"><thead><tr><th>Mes</th><th class="r">Sesiones</th><th class="r">Series</th><th class="r">Volumen</th><th class="r">Tiempo</th><th>Grupos con más volumen</th></tr></thead><tbody>
    ${months.map((m) => `<tr><td>${esc(cap(DF.month.format(m.d)))}</td><td class="r">${m.sessions}</td><td class="r">${m.workSets}</td><td class="r">${fmtVol(m.volume)}</td><td class="r">${fmtDur(m.minutes)}</td><td>${esc(groupsLine(m.byGroup))}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}
function viewSessionDetail(id) {
  const s = sessionById(id);
  if (!s) return `<div class="empty"><h3>Sesión no encontrada</h3><p>Puede que se haya eliminado.</p><button class="btn" data-action="back-history">Volver al historial</button></div>`;
  if (s.status === 'active') return `<div class="empty"><h3>Sesión en curso</h3><button class="btn btn-primary" data-action="nav" data-view="entrenar">Abrir</button></div>`;
  const prs = prEvents().filter((p) => p.sessionId === id);
  const prevSame = done().filter((x) => x.type === s.type && new Date(x.startedAt) < new Date(s.startedAt)).slice(-1)[0];
  return `
  <div class="row"><button class="btn btn-ghost btn-sm" data-action="back-history">${ICON.back}Historial</button></div>
  <div class="page-head"><div><p class="eyebrow">${esc(cap(fmtDateLong(s.startedAt)))} · ${fmtTime(s.startedAt)}</p><h1>${esc(C.TYPE_LABELS[s.type])}</h1></div>
    <div class="row">
      <button class="btn btn-sm" data-action="edit-session" data-id="${s.id}">${ICON.edit}Editar</button>
      <button class="btn btn-sm" data-action="start-copy" data-id="${s.id}" ${activeSession() ? 'disabled' : ''}>${ICON.copy}Repetir</button>
      ${prevSame ? `<button class="btn btn-sm" data-action="compare-sessions" data-a="${prevSame.id}" data-b="${s.id}">${ICON.compare}Comparar</button>` : ''}
      <button class="btn btn-sm btn-danger" data-action="delete-session" data-id="${s.id}">${ICON.trash}Eliminar</button></div></div>
  <div class="grid grid-tiles">
    ${tile('Duración', fmtDur(S.durationMinutes(s)), `${fmtTime(s.startedAt)} – ${s.endedAt ? fmtTime(s.endedAt) : '—'}`)}
    ${tile('Series de trabajo', S.sessionWorkSetCount(s), 'completadas, sin calentamiento')}
    ${tile('Volumen', `${nf(toUnit(S.sessionVolume(s)), 0)}<small>${unit()}</small>`, 'peso × repeticiones')}
    ${tile('Récords', prs.filter((p) => p.type !== 'volume').length, 'de peso o 1RM estimado')}
  </div>
  ${s.notes ? `<section class="card"><p class="eyebrow">Notas</p><p style="white-space:pre-wrap;margin-top:4px">${esc(s.notes)}</p></section>` : ''}
  ${prs.length ? `<section class="card"><div class="card-head"><h2>Récords</h2></div><div class="stack">${prs.map(prItemHTML).join('')}</div></section>` : ''}
  ${s.exercises.map((e) => detailEntry(s, e)).join('') || '<p class="muted">Sesión sin ejercicios.</p>'}`;
}
function detailEntry(s, e) {
  const cmp = S.compareWithPrevious(state.sessions, s, e.exerciseId);
  let n = 0;
  return `<section class="card">
    <div class="card-head"><button class="ex-head name" style="background:none;border:0;padding:0;font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--fg);text-align:left" data-action="open-exercise" data-ex="${e.exerciseId}">${esc(exName(e.exerciseId))}</button>
      <span class="small muted">${fmtVol(S.entryVolume(e))}</span></div>
    <div class="table-wrap"><table class="data"><thead><tr><th>Serie</th><th>Tipo</th><th class="r">Peso</th><th class="r">Reps</th><th class="r">Volumen</th><th class="r">1RM est.</th><th>Estado</th></tr></thead><tbody>
    ${e.sets.map((st) => {
      if (st.kind !== 'warmup') n++;
      const work = S.isWorkSet(st);
      return `<tr><td>${st.kind === 'warmup' ? 'C' : n}</td><td>${st.kind === 'warmup' ? '<span class="tag tag-warm">Calent.</span>' : st.kind === 'drop' ? '<span class="tag tag-pr">Descarga</span>' : 'Normal'}</td>
        <td class="r">${st.weight != null ? fmtW(st.weight) : '—'}</td><td class="r">${st.reps ?? '—'}</td>
        <td class="r">${work ? fmtVol(st.weight * st.reps) : '<span class="muted">—</span>'}</td>
        <td class="r">${work && st.reps <= S.E1RM_MAX_REPS ? wNum(S.epley1RM(st.weight, st.reps), 1) : '<span class="muted">—</span>'}</td>
        <td>${st.done ? 'Hecha' : '<span class="muted">Pendiente</span>'}</td></tr>`;
    }).join('')}</tbody></table></div>
    ${cmp ? comparisonBlock(cmp, `Comparado con ${fmtDate(cmp.previousDate)}`) : '<p class="small muted" style="margin-top:8px">Primera vez que se registra este ejercicio: no hay comparación.</p>'}
  </section>`;
}
/** Tabla de comparación serie a serie con diferencias absolutas y porcentuales. */
function comparisonBlock(cmp, refText) {
  const t = cmp.totals;
  return `<details style="margin-top:10px" open><summary class="small" style="cursor:pointer"><b>${esc(refText)}</b> · volumen ${deltaHTML(t.volume.diff, 'vol', t.volume.pct)} · reps ${deltaHTML(t.reps.diff, 'num', t.reps.pct)}</summary>
    <div class="table-wrap" style="margin-top:8px"><table class="data"><thead><tr><th>Serie</th><th>Antes</th><th>Ahora</th><th class="r">Peso</th><th class="r">Reps</th><th class="r">Volumen de la serie</th></tr></thead><tbody>
    ${cmp.pairs.map((p) => p.before && p.after ? `<tr><td>${p.index}</td><td>${fmtSet(p.before)}</td><td>${fmtSet(p.after)}</td>
        <td class="r">${deltaHTML(p.weightDiff, 'w', p.weightPct)}</td><td class="r">${deltaHTML(p.repsDiff, 'num', p.repsPct)}</td>
        <td class="r">${fmtVol(p.volumeBefore)} → ${fmtVol(p.volumeAfter)}<br>${deltaHTML(p.volumeDiff, 'vol', p.volumePct)}</td></tr>`
      : `<tr><td>${p.index}</td><td>${p.before ? fmtSet(p.before) : '—'}</td><td>${p.after ? fmtSet(p.after) : '—'}</td><td class="r muted" colspan="3">${p.after ? 'Serie extra hoy' : 'No se repitió'}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td>${plural(t.sets.before, 'serie', 'series')}</td><td>${plural(t.sets.after, 'serie', 'series')}</td>
      <td class="r">máx. ${deltaHTML(t.topWeight.diff, 'w', t.topWeight.pct)}</td><td class="r">${deltaHTML(t.reps.diff, 'num', t.reps.pct)}</td>
      <td class="r">${fmtVol(t.volume.before)} → ${fmtVol(t.volume.after)}<br>${deltaHTML(t.volume.diff, 'vol', t.volume.pct)}</td></tr>
    </tbody></table></div>
    <p class="small muted" style="margin-top:6px">Las series de trabajo se emparejan por orden. Los porcentajes usan la sesión anterior como referencia (100 %).</p></details>`;
}

// ---------------------------------------------------------------- progreso
function viewProgress() {
  const ds = done();
  const head = `<div class="page-head"><div><h1>Progreso</h1><p class="sub">Calculado solo con tus sesiones terminadas y series de trabajo completadas.</p></div>${ds.length ? periodChips('period', state.ui.period) : ''}</div>`;
  if (!ds.length) return head + `<div class="empty"><div class="plate">${ICON.chart}</div><h3>Todavía no hay nada que medir</h3><p>Termina tu primera sesión para ver el volumen por semana y por grupo muscular. Repite un ejercicio en otra sesión para ver su evolución, comparaciones y récords.</p><button class="btn btn-primary" data-action="nav" data-view="entrenar">Empezar a entrenar</button></div>`;
  const p = state.ui.period;
  const from = S.periodStart(p) || new Date(ds[0].startedAt);
  const sum = S.windowSummary(state.sessions, from, S.addDays(new Date(), 1));
  const weeks = Math.max(1, Math.ceil((new Date() - Math.max(+from, +new Date(ds[0].startedAt))) / (7 * 86400000)));
  const vg = S.volumeByGroup(state.sessions, exGroup, p);
  const maxG = Math.max(1, ...Object.values(vg).map((x) => x.volume));
  const tops = topExercises(p, 4);
  const prs = prEvents().filter((x) => S.inPeriod(x.date, p)).slice().reverse();
  return head + `
  <div class="grid grid-tiles">
    ${tile('Sesiones', sum.sessions, `${nf(sum.sessions / weeks, 1)} por semana de media`)}
    ${tile('Series de trabajo', sum.workSets, '')}
    ${tile('Volumen', `${compactNum(toUnit(sum.volume))}<small>${unit()}</small>`, 'total del período')}
    ${tile('Tiempo', fmtDur(sum.minutes), '')}
  </div>
  ${muscleMapCard(false)}
  ${stallsCard()}
  <section class="card"><div class="card-head"><h2>Volumen por semana</h2><span class="small muted">${unit()} · series de trabajo</span></div>
    ${chartSlot({ type: 'bar', points: weeklyVolumePoints(p), unit: unit(), label: 'Volumen semanal' })}
    <p class="small muted" style="margin-top:6px">El volumen mide cantidad de trabajo, no intensidad. Una semana con más volumen no es necesariamente una semana mejor.</p></section>
  <section class="card"><div class="card-head"><h2>Volumen por grupo muscular</h2></div>
    ${Object.keys(vg).length ? `<div class="stack">${Object.keys(vg).sort((a, b) => vg[b].volume - vg[a].volume).map((g) => `
      <div class="hbar"><span>${esc(C.GROUP_LABELS[g])}</span><div class="track"><div class="fill" style="width:${(vg[g].volume / maxG) * 100}%"></div></div><span class="small num">${fmtVol(vg[g].volume)} · ${vg[g].sets} series</span></div>`).join('')}</div>
      <p class="small muted" style="margin-top:10px">Se asigna según el grupo de cada ejercicio, no según el tipo de día.</p>` : '<p class="muted">Sin series en este período.</p>'}</section>
  <section class="card"><div class="card-head"><h2>Evolución de tus ejercicios más frecuentes</h2></div>
    ${tops.length ? `<div class="grid grid-2">${tops.map((t) => {
      const pts = metricPoints(t.id, 'e1rm', p);
      const st = S.exerciseStats(state.sessions, t.id);
      return `<div class="stack" style="gap:6px"><div class="row spread"><button class="btn btn-ghost btn-sm" style="padding:0;font-weight:700" data-action="open-exercise" data-ex="${t.id}">${esc(exName(t.id))}</button><span class="small muted">${plural(t.count, 'sesión', 'sesiones')}</span></div>
        ${chartSlot({ type: 'line', height: 150, points: pts, unit: unit(), label: '1RM estimado de ' + exName(t.id), empty: 'Sin series de 12 reps o menos para estimar el 1RM.' })}
        <p class="small muted">1RM estimado (Epley) · mejor serie actual: ${st.last ? fmtSet(st.last.topSet) : '—'}</p></div>`;
    }).join('')}</div>` : '<p class="muted">Sin ejercicios en este período.</p>'}</section>
  <section class="card"><div class="card-head"><h2>Récords del período</h2></div>
    ${prs.length ? `<div class="stack">${prs.slice(0, 12).map(prItemHTML).join('')}</div>${prs.length > 12 ? `<p class="small muted" style="margin-top:8px">Y ${prs.length - 12} más.</p>` : ''}` : '<p class="muted">Ningún récord en este período. Necesitas al menos dos sesiones de un mismo ejercicio.</p>'}</section>
  ${compareCard()}`;
}
function compareCard() {
  const ui = state.ui;
  const types = S.SESSION_TYPES.filter((t) => done().filter((s) => s.type === t).length >= 2);
  if (!types.length) return `<section class="card"><div class="card-head"><h2>Comparar sesiones</h2></div><p class="muted">Necesitas dos sesiones del mismo tipo de día para compararlas.</p></section>`;
  if (!types.includes(ui.cmpType)) { ui.cmpType = types[0]; ui.cmpA = ''; ui.cmpB = ''; }
  const list = done().filter((s) => s.type === ui.cmpType).slice().reverse();
  if (!list.find((s) => s.id === ui.cmpB)) ui.cmpB = list[0].id;
  if (!list.find((s) => s.id === ui.cmpA) || ui.cmpA === ui.cmpB) ui.cmpA = (list.find((s) => s.id !== ui.cmpB && new Date(s.startedAt) < new Date(sessionById(ui.cmpB).startedAt)) || list.find((s) => s.id !== ui.cmpB)).id;
  const a = sessionById(ui.cmpA), b = sessionById(ui.cmpB);
  const c = S.compareSessions(a, b);
  const opt = (sel) => list.map((s) => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${fmtDate(s.startedAt)} · ${fmtTime(s.startedAt)}</option>`).join('');
  return `<section class="card" id="compare"><div class="card-head"><h2>Comparar sesiones</h2></div>
    <div class="filters">
      <label class="field" for="cmp-type">Tipo de día<select class="input" id="cmp-type" data-cmp="cmpType">${types.map((t) => `<option value="${t}" ${t === ui.cmpType ? 'selected' : ''}>${esc(C.TYPE_LABELS[t])}</option>`).join('')}</select></label>
      <label class="field" for="cmp-a">Referencia (antes)<select class="input" id="cmp-a" data-cmp="cmpA">${opt(ui.cmpA)}</select></label>
      <label class="field" for="cmp-b">Comparada (ahora)<select class="input" id="cmp-b" data-cmp="cmpB">${opt(ui.cmpB)}</select></label>
    </div>
    <div class="table-wrap" style="margin-top:12px"><table class="data"><thead><tr><th>Ejercicio</th><th>Antes</th><th>Ahora</th><th class="r">Peso máx.</th><th class="r">Volumen</th></tr></thead><tbody>
    ${c.exercises.map((x) => { const t = x.comparison.totals; return `<tr><td>${esc(exName(x.exerciseId))}</td>
      <td>${x.inBefore ? `${plural(t.sets.before, 'serie', 'series')}, máx. ${fmtW(t.topWeight.before)}` : '<span class="muted">—</span>'}</td>
      <td>${x.inAfter ? `${plural(t.sets.after, 'serie', 'series')}, máx. ${fmtW(t.topWeight.after)}` : '<span class="muted">—</span>'}</td>
      <td class="r">${x.inBefore && x.inAfter ? deltaHTML(t.topWeight.diff, 'w', t.topWeight.pct) : '<span class="muted small">no comparable</span>'}</td>
      <td class="r">${x.inBefore && x.inAfter ? deltaHTML(t.volume.diff, 'vol', t.volume.pct) : '<span class="muted small">no comparable</span>'}</td></tr>`; }).join('')}
    <tr><td><b>Sesión</b></td><td>${fmtVol(c.totals.volume.before)} · ${fmtDur(c.totals.duration.before)}</td><td>${fmtVol(c.totals.volume.after)} · ${fmtDur(c.totals.duration.after)}</td>
      <td class="r">${deltaHTML(c.totals.sets.diff, 'num', c.totals.sets.pct)} series</td><td class="r">${deltaHTML(c.totals.volume.diff, 'vol', c.totals.volume.pct)}</td></tr>
    </tbody></table></div>
    <p class="small muted" style="margin-top:8px">Referencia: ${esc(C.TYPE_SHORT[a.type])} del ${fmtDate(a.startedAt)}. Los porcentajes se calculan respecto a esa sesión.</p></section>`;
}

// ---------------------------------------------------------------- ejercicios
function viewExercises() {
  if (state.route.sub && state.route.sub.exerciseId) return viewExerciseSheet(state.route.sub.exerciseId);
  const ui = state.ui;
  const nq = S.normName(ui.exq);
  const usage = cached('usage', () => { const m = {}; done().forEach((x) => x.exercises.forEach((e) => { m[e.exerciseId] = (m[e.exerciseId] || 0) + 1; })); return m; });
  let items = state.exercises.filter((e) => !e.archived);
  if (ui.exgroup) items = items.filter((e) => e.group === ui.exgroup);
  if (ui.favOnly) items = items.filter((e) => e.favorite);
  if (nq) items = items.filter((e) => S.normName(e.name).includes(nq));
  items.sort((a, b) => (b.favorite - a.favorite) || ((usage[b.id] || 0) - (usage[a.id] || 0)) || a.name.localeCompare(b.name, 'es'));
  return `
  <div class="page-head"><div><h1>Ejercicios</h1><p class="sub">Catálogo y tus ejercicios propios. Marca con la estrella los habituales para que salgan primero al entrenar.</p></div>
    <button class="btn btn-primary" data-action="new-exercise">${ICON.plus}Nuevo ejercicio</button></div>
  <section class="card stack">
    <label class="field" for="ex-q"><span class="sr-only">Buscar</span><input class="input" type="search" id="ex-q" data-exq value="${esc(ui.exq)}" placeholder="Buscar ejercicio"></label>
    <div class="chips">
      <button class="chip" data-action="ex-fav" aria-pressed="${ui.favOnly}">${ICON.star.replace('<svg', '<svg width="14" height="14" style="vertical-align:-2px"')} Favoritos</button>
      <button class="chip" data-action="ex-group" data-g="" aria-pressed="${!ui.exgroup}">Todos</button>
      ${S.GROUPS.map((g) => `<button class="chip" data-action="ex-group" data-g="${g}" aria-pressed="${ui.exgroup === g}">${esc(C.GROUP_LABELS[g])}</button>`).join('')}
    </div>
  </section>
  <section class="card" style="padding:4px 12px" id="ex-results">${items.length ? `<div class="list">${items.map((e) => {
    const st = usage[e.id] ? S.exerciseStats(state.sessions, e.id) : null;
    return `<div class="list-item">
      <button class="btn btn-ghost icon-btn star" data-action="fav" data-ex="${e.id}" aria-pressed="${!!e.favorite}" aria-label="${e.favorite ? 'Quitar de favoritos' : 'Añadir a favoritos'}: ${esc(e.name)}">${e.favorite ? ICON.starFill : ICON.star}</button>
      <button class="grow" style="background:none;border:0;text-align:left;padding:0;color:inherit" data-action="open-exercise" data-ex="${e.id}">
        <div class="title">${esc(e.name)} ${e.custom ? '<span class="tag">Propio</span>' : ''}</div>
        <div class="sub">${esc(C.GROUP_LABELS[e.group])}${st ? ` · ${plural(st.sessionCount, 'sesión', 'sesiones')} · mejor ${fmtW(st.bestWeight.weight)} × ${st.bestWeight.reps}` : ' · sin registros'}</div>
      </button></div>`;
  }).join('')}</div>` : `<p class="muted" style="padding:14px 4px">No hay ejercicios con estos filtros.</p>`}</section>`;
}
function viewExerciseSheet(id) {
  const ex = state.exById.get(id);
  if (!ex) return `<div class="empty"><h3>Ejercicio no encontrado</h3><button class="btn" data-action="nav" data-view="ejercicios">Volver</button></div>`;
  const st = S.exerciseStats(state.sessions, id);
  const ui = state.ui;
  const back = state.route.sub.back;
  const head = `<div class="row"><button class="btn btn-ghost btn-sm" data-action="sheet-back">${ICON.back}${back === 'ejercicios' || !back ? 'Ejercicios' : 'Volver'}</button></div>
  <div class="page-head"><div><p class="eyebrow">${esc(C.GROUP_LABELS[ex.group])}${ex.custom ? ' · propio' : ''}</p><h1>${esc(ex.name)}</h1></div>
    <div class="row"><button class="btn btn-sm star" data-action="fav" data-ex="${id}" aria-pressed="${!!ex.favorite}">${ex.favorite ? ICON.starFill : ICON.star}${ex.favorite ? 'Favorito' : 'Marcar favorito'}</button>
    <button class="btn btn-sm" data-action="edit-exercise" data-ex="${id}">${ICON.edit}Editar</button></div></div>`;
  if (!st.sessionCount) return head + musclesCard(id) + `<div class="empty"><div class="plate">—</div><h3>Sin registros todavía</h3><p>Cuando completes series de este ejercicio en una sesión terminada verás aquí tu último peso, tu mejor marca, el 1RM estimado y su evolución.</p></div>`;
  const pts = metricPoints(id, ui.exMetric, ui.exPeriod);
  return head + `
  <div class="grid grid-tiles">
    ${tile('Última vez', `${fmtSet(st.last.topSet)}<small>${unit()}</small>`, `${fmtDate(st.last.date)} · mejor serie`)}
    ${tile('Mejor peso', `${wNum(st.bestWeight.weight)}<small>${unit()}</small>`, `× ${st.bestWeight.reps} · ${fmtDate(st.bestWeight.date)}`)}
    ${tile('1RM estimado', st.bestE1RM ? `${wNum(st.bestE1RM.value, 1)}<small>${unit()}</small>` : '—', st.bestE1RM ? `Estimación Epley con ${fmtSet(st.bestE1RM)} · ${fmtDate(st.bestE1RM.date)}` : 'Sin series de ≤12 reps')}
    ${tile('Más repeticiones', `${st.bestReps.reps}<small>reps</small>`, `con ${fmtW(st.bestReps.weight)} · ${fmtDate(st.bestReps.date)}`)}
    ${tile('Mejor volumen', `${compactNum(toUnit(st.bestVolume.volume))}<small>${unit()}</small>`, `en una sesión · ${fmtDate(st.bestVolume.date)}`)}
    ${tile('Sesiones', st.sessionCount, `desde ${fmtDate(st.history[0].date)}`)}
  </div>
  ${musclesCard(id)}
  ${nextTimeCard(id)}
  <section class="card"><div class="card-head"><h2>Última sesión frente a la anterior</h2></div>
    ${st.comparison ? comparisonBlock(st.comparison, `${fmtDate(st.prev.date)} → ${fmtDate(st.last.date)}`) : '<p class="muted">Con una segunda sesión de este ejercicio verás la comparación serie a serie.</p>'}</section>
  <section class="card"><div class="card-head"><h2>Evolución</h2>${periodChips('exPeriod', ui.exPeriod)}</div>
    <div class="chips" style="margin-bottom:10px" role="group" aria-label="Métrica">${Object.keys(METRICS).map((m) => `<button class="chip" data-action="ex-metric" data-m="${m}" aria-pressed="${ui.exMetric === m}">${METRICS[m]}</button>`).join('')}</div>
    ${chartSlot({ type: 'line', points: pts, unit: metricUnit(ui.exMetric), label: METRICS[ui.exMetric] + ' de ' + ex.name, empty: ui.exMetric === 'e1rm' ? 'Sin series de 12 repeticiones o menos en este período.' : 'Sin sesiones en este período.' })}

      ${st.repMax.map((r) => `<tr><td>${r.reps}</td><td class="r">${fmtW(r.weight)}</td><td class="r">${fmtDate(r.date)}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="card"><div class="card-head"><h2>Historial</h2></div><div class="list">
      ${st.history.slice().reverse().slice(0, 30).map((h) => `<button class="list-item" data-action="open-session" data-id="${h.sessionId}"><div class="grow"><div class="title">${fmtDate(h.date)}</div><div class="sub">${h.sets.map(fmtSet).join(' · ')}</div></div><span class="small muted num">${fmtVol(h.volume)}</span></button>`).join('')}
    </div></section>
  </div>`;
}
function openExerciseForm(ex, opts = {}) {
  const isNew = !ex;
  const cfg = S.progressionConfig(ex);
  // copia de trabajo de los músculos: {músculo: 1 | 0,5}
  let work = Object.assign({}, ex ? muscleInfo(ex.id).muscles : {});
  const def = ex ? defaultMuscles(ex) : null;
  const used = ex ? done().some((s) => s.exercises.some((e) => e.exerciseId === ex.id)) || (activeSession() && activeSession().exercises.some((e) => e.exerciseId === ex.id)) : false;
  const actions = [{ label: 'Cancelar', cls: 'btn-ghost' }];

    if (!Object.values(work).includes(1)) { err.textContent = 'Marca al menos un músculo principal: toca un músculo en el mapa (1 toque = principal, 2 = secundario).'; err.hidden = false; return false; }
    const sameAsCatalog = def && def.source === 'catalog' && JSON.stringify(sortObj(def.muscles)) === JSON.stringify(sortObj(work));
    if (isNew) {

      <label class="field" for="exf-group">Grupo muscular<select class="input" id="exf-group">${S.GROUPS.map((g) => `<option value="${g}" ${(ex ? ex.group : 'pecho') === g ? 'selected' : ''}>${esc(C.GROUP_LABELS[g])}</option>`).join('')}</select></label>
      <fieldset style="border:0;padding:0;margin:0" id="exf-mfield"><legend class="field" style="margin-bottom:6px">Músculos trabajados</legend>
        <p class="small muted">Toca un músculo: una vez = <b class="role-chip r1">principal</b>, dos = <b class="role-chip r05">secundario</b>, tres = quitar. El principal cuenta 1 serie y el secundario 0,5.</p>
        <div id="exf-muscles"></div></fieldset>

        <div class="filters">
          <label class="field" for="exf-min">Reps mínimas<input class="input" id="exf-min" inputmode="numeric" value="${cfg.repMin}"></label>

          <label class="field" for="exf-inc">Incremento (${unit()})<input class="input" id="exf-inc" inputmode="decimal" value="${inputValue(cfg.increment)}"></label>
        </div>
        <p class="small muted" style="margin-top:6px">Cuando todas tus series lleguen a las reps máximas, la app sugerirá subir el incremento y volver a las mínimas. Ejemplos: 8–12 para hipertrofia, 3–6 para fuerza.</p></fieldset>

          <p class="small" style="margin-top:8px"><b>Principales:</b> ${esc(prim || '—')}<br><b>Secundarios:</b> ${esc(sec || '—')}</p>

        const t = ev.target.closest('[data-muscle], [data-mchip], [data-mreset]');

}

/* GymTracker — mapa muscular, avisos de estancamiento, resumen mensual e imagen compartible. */

const MAP_RANGES = { week: 'Esta semana', last: 'Semana pasada', avg4: 'Media 4 semanas' };
const WEEKDAYS = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];

// ---------------------------------------------------------------- mapa muscular
function mapData(range) {
  const now = new Date();
  const wk = S.startOfWeek(now);
  let from = wk, to = S.addDays(wk, 7), div = 1, label = 'del ' + fmtDate(wk) + ' al ' + fmtDate(S.addDays(wk, 6));
  if (range === 'last') { from = S.addDays(wk, -7); to = wk; label = 'del ' + fmtDate(from) + ' al ' + fmtDate(S.addDays(wk, -1)); }
  if (range === 'avg4') { from = S.addDays(wk, -28); to = wk; div = 4; label = 'media semanal de las 4 semanas completas anteriores'; }
  const raw = cached('msets:' + range + ':' + S.dayKey(from), () => S.muscleSetsBetween(state.sessions, exMuscles, from, to));
  const out = {};
  S.MUSCLES.forEach((m) => {
    const r = raw[m] || { sets: 0, direct: 0, indirect: 0, byExercise: {} };
    const byEx = {};
    Object.keys(r.byExercise).forEach((id) => { byEx[id] = r.byExercise[id] / div; });
    out[m] = { sets: S.round(r.sets / div, 1), direct: r.direct / div, indirect: r.indirect / div, byExercise: byEx };
  });
  return { muscles: out, label, div };
}
function muscleRow(m, v) {
  const max = 25;
  return `<button class="mm-row" data-action="map-select" data-muscle="${m}" aria-pressed="${state.ui.mapSel === m}">
    <span class="mm-name"><i class="sw lv${S.weeklySetsLevel(v)}"></i>${esc(C.MUSCLE_SHORT[m])}</span>
    <span class="mm-track" aria-hidden="true"><span class="mm-band" style="left:${(10 / max) * 100}%;width:${(10 / max) * 100}%"></span><span class="mm-fill" style="width:${Math.min(100, (v / max) * 100)}%"></span></span>
    <span class="mm-val num">${nf(v, 1)}</span></button>`;
}
function muscleDetail(m, d) {
  const r = d.muscles[m];
  const ids = Object.keys(r.byExercise).sort((a, b) => r.byExercise[b] - r.byExercise[a]);
  return `<div class="mm-detail" aria-live="polite">
    <div class="row spread"><b>${esc(C.MUSCLE_LABELS[m])}</b><button class="btn btn-ghost btn-sm" data-action="map-select" data-muscle="">${ICON.x}<span class="sr-only">Cerrar detalle</span></button></div>
    <p class="small"><b class="num">${nf(r.sets, 1)}</b> series ponderadas${[r.direct ? `${nf(r.direct, 1)} como principal` : '', r.indirect ? `${nf(r.indirect, 1)} como secundario (×0,5)` : ''].filter(Boolean).map((x, i) => (i ? ' y ' : ': ') + x).join('')}.</p>
    ${ids.length ? `<div class="list">${ids.map((id) => `<button class="list-item" data-action="open-exercise" data-ex="${id}"><span class="grow">${esc(exName(id))} <span class="small muted">· ${exMuscles(id)[m] === 1 ? 'principal' : 'secundario'}</span></span><span class="small num">${nf(r.byExercise[id], 1)}</span></button>`).join('')}</div>`
      : '<p class="small muted">Ningún ejercicio ha trabajado este músculo en este período.</p>'}</div>`;
}
function muscleMapCard(compact) {
