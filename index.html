/* Layout: app shell — barra lateral en escritorio, barra inferior en móvil; columna de contenido de 960px.
   Tema oscuro único (dirección pedida): grafito azulado, acento lima para acción, violeta reservado a récords, naranja a calentamiento. */
:root {
  --bg: #0d1117;
  --surface: #151b23;
  --surface-2: #1c232d;
  --surface-3: #252e3a;
  --line: #2a3340;
  --fg: #e9edf2;
  --muted: #8d97a5;
  --faint: #5d6776;
  --accent: #c8f031;
  --accent-ink: #11160a;
  --accent-soft: rgba(200, 240, 49, 0.12);
  --pr: #b197ff;
  --pr-soft: rgba(177, 151, 255, 0.14);
  --warm: #ffa24c;
  --warm-soft: rgba(255, 162, 76, 0.14);
  --up: #6be3a8;
  --down: #ff8a8a;
  --danger: #ff6b6b;
  --heat-1: #3d521a; --heat-2: #66891f; --heat-3: #86ab22; --heat-4: #c8f031;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --nav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 2rem; font-weight: 700; line-height: 1.05; text-transform: uppercase; }

/* ---------- shell ---------- */
.shell { display: flex; min-height: 100vh; }
.nav {

  white-space: nowrap; overflow: hidden;

.nav .live-dot { position: absolute; top: 6px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
.main {
  flex: 1; min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

  padding-block: 20px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px));

  }
  .nav-brand { display: block; padding: 4px 12px 20px; }
  .nav button { flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 0.95rem; padding: 10px 12px; }
  .nav button[aria-current="page"] { background: var(--accent-soft); }
  .nav .live-dot { position: static; margin-left: auto; }
  .main { margin-left: 208px; padding-block: 32px 48px; padding-left: 40px; padding-right: 40px; }
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.02em; }
.brand b { color: var(--accent); }

/* ---------- elementos ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-head .sub { color: var(--muted); margin-top: 4px; max-width: 60ch; }

  border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-weight: 600;

}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(0.98); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent); background: color-mix(in srgb, var(--accent) 88%, white); }
.btn-danger { color: var(--danger); border-color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); background: transparent; }
.btn-danger:hover { background: rgba(255, 107, 107, 0.12); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.btn-ghost { background: transparent; border-color: transparent; }

.btn-sm { min-height: 36px; padding: 0 12px; font-size: 0.9rem; }
.btn-lg { min-height: 56px; font-size: 1.1rem; padding: 0 22px; }

.icon-btn { width: 40px; height: 40px; padding: 0; min-height: 0; flex: none; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; min-height: 34px;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.tag-pr { background: var(--pr-soft); color: var(--pr); }
.tag-warm { background: var(--warm-soft); color: var(--warm); }
.tag-accent { background: var(--accent-soft); color: var(--accent); }

label.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); font-weight: 600; min-width: 0; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: var(--r-md);
  background: var(--bg); border: 1px solid var(--line); color: var(--fg); font-size: 1rem; font-weight: 500;
}
textarea.input { min-height: 80px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.filters { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

.up { color: var(--up); }
.down { color: var(--down); }
.delta { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- tiles ---------- */
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .big { font-family: var(--font-display); font-size: 2rem; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .big small { font-size: 0.55em; color: var(--muted); font-weight: 600; margin-left: 2px; }
.tile .foot { font-size: 0.82rem; color: var(--muted); }

/* ---------- vacío ---------- */
.empty { text-align: left; padding: 28px 20px; border: 1px dashed var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: repeating-linear-gradient(135deg, transparent 0 12px, rgba(255,255,255,0.012) 12px 24px); }
.empty h3 { font-size: 1.3rem; text-transform: uppercase; }
.empty p { color: var(--muted); max-width: 56ch; }
.plate { width: 56px; height: 56px; border-radius: 50%; border: 6px solid var(--surface-3); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: var(--muted); font-size: 0.85rem; }

/* ---------- entrenar ---------- */
.type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.type-btn {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  min-height: 92px; padding: 14px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  transition: border-color .15s, transform .08s;
}
.type-btn:hover { border-color: var(--accent); }
.type-btn:active { transform: scale(0.98); }
.type-btn .t { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; text-transform: uppercase; line-height: 1; }
.type-btn .s { font-size: 0.8rem; color: var(--muted); }
.type-btn.suggested { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.session-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  margin: -20px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
@media (min-width: 900px) { .session-bar { margin: -32px -40px 0; padding: 12px 40px; } }
.session-bar .timer { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.session-bar .meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.session-bar .meta .t { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; text-transform: uppercase; line-height: 1.1; }
.save-state { font-size: 0.75rem; color: var(--faint); }

.ex-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.ex-card.complete { border-color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.ex-head { display: flex; align-items: flex-start; gap: 8px; padding: 12px 12px 4px 14px; }
.ex-head .name { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; line-height: 1.1; background: none; border: 0; padding: 0; text-align: left; color: var(--fg); }
.ex-head .name:hover { color: var(--accent); }
.ex-last { padding: 0 14px 8px; font-size: 0.82rem; color: var(--muted); }
.ex-last b { color: var(--fg); font-weight: 600; }
.prog-line { margin: 0 12px 10px 14px; padding: 8px 10px; border-radius: var(--r-md); background: var(--accent-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.prog-line .grow { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 2px; }
.prog-title { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; color: var(--fg); }
.prog-title svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.prog-reason { font-size: 0.8rem; color: var(--muted); }
.faint { color: var(--faint); }
.stall-note { flex-basis: 100%; display: flex; gap: 6px; align-items: flex-start; font-size: 0.8rem; color: var(--warm); margin: 0; }
.stall-note svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.sets { display: flex; flex-direction: column; }
.set-hdr, .set-row { display: grid; grid-template-columns: 40px minmax(48px, 0.9fr) minmax(64px, 1fr) minmax(56px, 1fr) 48px 36px; gap: 6px; align-items: center; padding: 4px 10px; }
.set-hdr { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); font-weight: 700; padding-top: 6px; padding-bottom: 2px; }
.set-hdr span:nth-child(n+3) { text-align: center; }
.set-row { transition: background .25s; }
.set-row.done { background: rgba(200, 240, 49, 0.07); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.set-row.flash { animation: flash .6s ease-out; }
@keyframes flash { 0% { background: rgba(200, 240, 49, 0.3); background: color-mix(in srgb, var(--accent) 30%, transparent); } 100% { background: rgba(200, 240, 49, 0.07); background: color-mix(in srgb, var(--accent) 7%, transparent); } }
.set-row.pr-row { background: var(--pr-soft); }
.kind-btn { width: 40px; height: 40px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--fg); padding: 0; }
.kind-btn.warmup { color: var(--warm); border-color: var(--warm); border-color: color-mix(in srgb, var(--warm) 45%, var(--line)); background: var(--warm-soft); }
.kind-btn.drop { color: var(--pr); border-color: var(--pr); border-color: color-mix(in srgb, var(--pr) 45%, var(--line)); background: var(--pr-soft); }
.prev-cell { font-size: 0.82rem; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-input { width: 100%; height: 46px; text-align: center; font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; border-radius: var(--r-sm); background: var(--bg); border: 1px solid var(--line); color: var(--fg); padding: 0 4px; min-width: 0; }
.set-input::placeholder { color: var(--faint); font-weight: 500; }
.set-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.set-input[aria-invalid="true"] { border-color: var(--danger); }
.check-btn { width: 48px; height: 46px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; padding: 0; color: var(--faint); }
.check-btn svg { width: 22px; height: 22px; }
.check-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check-btn[aria-pressed="true"].pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(0.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.more-btn { width: 36px; height: 40px; border: 0; background: none; color: var(--muted); border-radius: var(--r-sm); padding: 0; display: grid; place-items: center; }
.more-btn svg { width: 20px; height: 20px; }
.set-actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 10px 8px 56px; }
.set-err { padding: 0 10px 6px 56px; color: var(--danger); font-size: 0.82rem; }
.ex-foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px 12px; flex-wrap: wrap; }
.ex-foot .vol { margin-left: auto; font-size: 0.82rem; color: var(--muted); }
.legend-kinds { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.legend-kinds span { display: inline-flex; gap: 6px; align-items: center; }
.legend-kinds i { font-style: normal; font-family: var(--font-display); font-weight: 700; width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); font-size: 0.8rem; }
@media (max-width: 380px) {
  .set-hdr, .set-row { grid-template-columns: 36px minmax(40px, 0.7fr) minmax(56px, 1fr) minmax(48px, 1fr) 44px 30px; gap: 4px; padding: 4px 6px; }
  .kind-btn { width: 36px; }
  .check-btn { width: 44px; }
}

/* ---------- listas ---------- */
.list { display: flex; flex-direction: column; }
.list-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line);
  background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: var(--fg);
}
.list-item:last-child { border-bottom: 0; }
button.list-item:hover { background: var(--surface-2); }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { font-weight: 600; }
.list-item .sub { color: var(--muted); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; }

.date-badge .d { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; display: block; }
.date-badge .m { font-size: 0.68rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.08em; font-weight: 700; }
.star { color: var(--faint); }
.star[aria-pressed="true"] { color: var(--warm); }
.star svg { width: 22px; height: 22px; }

.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
table.data th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }

table.data td.r, table.data th.r { text-align: right; }

.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px; width: fit-content; max-width: 100%; overflow-x: auto; }
.tabs button { border: 0; background: none; color: var(--muted); padding: 8px 14px; border-radius: var(--r-sm); font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface-3); color: var(--fg); }

/* ---------- calendario y mapa ---------- */

<script>
/* GymTracker — cálculos estadísticos centralizados.
 * Funciones puras: no tocan el DOM ni el almacenamiento.
 * Todos los pesos se guardan y calculan en kilogramos.
 * Se pueden probar en Node (module.exports) y se usan en el navegador (window.GTStats).

(function (root) {
  'use strict';

  const KG_PER_LB = 0.45359237;
  const E1RM_MAX_REPS = 12; // por encima, la estimación de 1RM no se usa para récords
  const DAY = 86400000;

  const MUSCLES = ['pecho_sup', 'pecho_med', 'hombro_ant', 'hombro_lat', 'hombro_post', 'trapecio', 'espalda_alta', 'dorsales', 'lumbares',

  /** Peso de un músculo en un ejercicio: 1 = principal, 0,5 = secundario. */
  const MUSCLE_ROLES = [1, 0.5];

  // ---------- utilidades numéricas ----------
  function round(n, d = 1) {
    const f = Math.pow(10, d);
    return Math.round((n + Number.EPSILON) * f) / f;

  function kgToLb(kg) { return kg / KG_PER_LB; }
  function lbToKg(lb) { return lb * KG_PER_LB; }

  /** Diferencia porcentual de a → b. Devuelve null si la referencia es 0. */
  function pctChange(before, after) {
    if (before === null || before === undefined || after === null || after === undefined) return null;
    if (before === 0) return null;
    return ((after - before) / before) * 100;
  }

  /** 1RM estimado con la fórmula de Epley. Con 1 repetición devuelve el propio peso. */
  function epley1RM(weight, reps) {
    if (!(weight > 0) || !(reps > 0)) return 0;
    if (reps === 1) return weight;
    return weight * (1 + reps / 30);
  }

  /** Interpreta un número escrito por el usuario ("72,5", " 80 "). */
  function parseNum(str) {
    if (typeof str === 'number') return Number.isFinite(str) ? str : NaN;
    if (typeof str !== 'string') return NaN;
    const s = str.trim().replace(',', '.');
    if (s === '') return NaN;
    if (!/^-?\d*\.?\d+$/.test(s) && !/^-?\d+\.?$/.test(s)) return NaN;
    return Number(s);

  function validateWeight(kg) {
    if (kg === null || kg === undefined || Number.isNaN(kg)) return 'Escribe un peso';
    if (kg < 0) return 'El peso no puede ser negativo';
    if (kg > 1000) return 'El peso parece demasiado alto (máx. 1000 kg)';
    return null;
  }
  function validateReps(reps) {
    if (reps === null || reps === undefined || Number.isNaN(reps)) return 'Escribe las repeticiones';
    if (!Number.isInteger(reps)) return 'Las repeticiones deben ser un número entero';
    if (reps < 0) return 'Las repeticiones no pueden ser negativas';
    if (reps > 500) return 'Demasiadas repeticiones (máx. 500)';
    return null;
  }

  // ---------- series y volumen ----------
  /** Serie de trabajo: completada, no de calentamiento, con repeticiones y peso válidos. */
  function isWorkSet(s) {
    return !!s && s.done === true && s.kind !== 'warmup' &&
      typeof s.reps === 'number' && s.reps > 0 &&
      typeof s.weight === 'number' && s.weight >= 0;

  function setVolume(s) { return isWorkSet(s) ? s.weight * s.reps : 0; }

  }
  function sessionWorkSetCount(session) {
    return (session.exercises || []).reduce((a, e) => a + workSets(e).length, 0);
  }

  function topSet(sets) {
    let best = null;
    for (const s of sets) {

    }
    return best;
  }
  function bestE1RMOfSets(sets) {
    let best = 0, bestSet = null;
    for (const s of sets) {
      if (s.reps > E1RM_MAX_REPS) continue;
      const v = epley1RM(s.weight, s.reps);
      if (v > best) { best = v; bestSet = s; }

    const s = startOfDay(d);
    const dow = (s.getDay() + 6) % 7; // 0 = lunes
    s.setDate(s.getDate() - dow);
    return s;
  }
  function weekKey(d) { return dayKey(startOfWeek(d)); }
  function startOfMonth(d) { d = toDate(d); return new Date(d.getFullYear(), d.getMonth(), 1); }
  function addDays(d, n) { const r = new Date(toDate(d)); r.setDate(r.getDate() + n); return r; }
  function addMonths(d, n) { const r = new Date(toDate(d)); r.setMonth(r.getMonth() + n); return r; }

  const PERIODS = {
    '4w': { label: '4 semanas', from: (now) => addDays(startOfDay(now), -27) },
    '3m': { label: '3 meses', from: (now) => addMonths(startOfDay(now), -3) },
    '6m': { label: '6 meses', from: (now) => addMonths(startOfDay(now), -6) },
    '1y': { label: '1 año', from: (now) => addMonths(startOfDay(now), -12) },
    'all': { label: 'Todo', from: () => null },
  };
  function periodStart(period, now = new Date()) {
    const p = PERIODS[period] || PERIODS.all;
    return p.from(now);
  }
  function inPeriod(date, period, now = new Date()) {
    const from = periodStart(period, now);
    return !from || toDate(date) >= from;
  }

  /** Duración en minutos (redondeada) entre inicio y fin. */
  function durationMinutes(session, now = new Date()) {
    if (!session.startedAt) return 0;
    const end = session.endedAt ? toDate(session.endedAt) : now;
    const ms = end - toDate(session.startedAt);
    return ms > 0 ? Math.round(ms / 60000) : 0;
  }

  // ---------- sesiones terminadas ----------
  function doneSessions(sessions) {
    return sessions.filter((s) => s.status === 'done')
      .slice().sort((a, b) => toDate(a.startedAt) - toDate(b.startedAt));
  }

  /** Historial de un ejercicio: una fila por sesión terminada en la que aparece con series de trabajo. */
  function exerciseHistory(sessions, exerciseId) {
    const out = [];
    for (const s of doneSessions(sessions)) {
      const entries = (s.exercises || []).filter((e) => e.exerciseId === exerciseId);
      if (!entries.length) continue;
      const sets = entries.flatMap(workSets);
      if (!sets.length) continue;
      const top = topSet(sets);
      const e1 = bestE1RMOfSets(sets);
      out.push({
        sessionId: s.id,
        date: s.startedAt,
        sets,
        topSet: top,
        topWeight: top.weight,
        totalReps: sets.reduce((a, x) => a + x.reps, 0),
        maxReps: Math.max(...sets.map((x) => x.reps)),
        volume: sets.reduce((a, x) => a + x.weight * x.reps, 0),
        e1rm: e1.value,
      });
    }
    return out;
  }

  /** Estadísticas completas de un ejercicio a partir de su historial. */
  function exerciseStats(sessions, exerciseId) {
    const hist = exerciseHistory(sessions, exerciseId);
    if (!hist.length) return { history: hist, sessionCount: 0 };
    let bestWeight = null, bestE1 = null, bestVolume = null, bestReps = null;
    const repMax = {}; // repeticiones -> {weight, date}
    for (const h of hist) {
      for (const s of h.sets) {
        if (!bestWeight || s.weight > bestWeight.weight || (s.weight === bestWeight.weight && s.reps > bestWeight.reps)) {
          bestWeight = { weight: s.weight, reps: s.reps, date: h.date, sessionId: h.sessionId };
        }
        if (!bestReps || s.reps > bestReps.reps || (s.reps === bestReps.reps && s.weight > bestReps.weight)) {
          bestReps = { weight: s.weight, reps: s.reps, date: h.date, sessionId: h.sessionId };
        }
        const cur = repMax[s.reps];
        if (!cur || s.weight > cur.weight) repMax[s.reps] = { weight: s.weight, date: h.date };
        if (s.reps <= E1RM_MAX_REPS) {
          const v = epley1RM(s.weight, s.reps);
          if (!bestE1 || v > bestE1.value) bestE1 = { value: v, weight: s.weight, reps: s.reps, date: h.date };
        }
      }
      if (!bestVolume || h.volume > bestVolume.volume) bestVolume = { volume: h.volume, date: h.date };
    }
    const last = hist[hist.length - 1];
    const prev = hist.length > 1 ? hist[hist.length - 2] : null;
    return {
      history: hist,
      sessionCount: hist.length,
      last,
      prev,
      bestWeight,
      bestReps,
      bestE1RM: bestE1,
      bestVolume,
      repMax: Object.keys(repMax).map(Number).sort((a, b) => a - b)
        .map((r) => ({ reps: r, weight: repMax[r].weight, date: repMax[r].date })),
      comparison: prev ? compareSetLists(prev.sets, last.sets) : null,
    };
  }

  /** Compara dos series concretas. */
  function compareSet(before, after) {
    const vB = before.weight * before.reps;
    const vA = after.weight * after.reps;
    return {
      before, after,
      weightDiff: after.weight - before.weight,
      weightPct: pctChange(before.weight, after.weight),
      repsDiff: after.reps - before.reps,
      repsPct: pctChange(before.reps, after.reps),
      volumeBefore: vB,
      volumeAfter: vA,
      volumeDiff: vA - vB,
      volumePct: pctChange(vB, vA),
    };
  }

  /** Compara dos listas de series de trabajo, emparejándolas por orden, más los totales. */
  function compareSetLists(beforeSets, afterSets) {
    const n = Math.max(beforeSets.length, afterSets.length);
    const pairs = [];
    for (let i = 0; i < n; i++) {
      const b = beforeSets[i] || null, a = afterSets[i] || null;
      pairs.push(b && a ? Object.assign({ index: i + 1 }, compareSet(b, a)) : { index: i + 1, before: b, after: a });
    }
    const tot = (sets) => ({
      volume: sets.reduce((x, s) => x + s.weight * s.reps, 0),
      reps: sets.reduce((x, s) => x + s.reps, 0),
      sets: sets.length,
      topWeight: sets.length ? topSet(sets).weight : 0,
      e1rm: bestE1RMOfSets(sets).value,
    });
    const tb = tot(beforeSets), ta = tot(afterSets);
    const totals = {};
    for (const k of Object.keys(tb)) {
      totals[k] = { before: tb[k], after: ta[k], diff: ta[k] - tb[k], pct: pctChange(tb[k], ta[k]) };
    }
    return { pairs, totals };
  }

  /** Compara un ejercicio de una sesión con su ejecución anterior (sesiones terminadas previas). */
  function compareWithPrevious(sessions, session, exerciseId) {
    const entries = (session.exercises || []).filter((e) => e.exerciseId === exerciseId);
    const after = entries.flatMap(workSets);
    const t = toDate(session.startedAt);
    const hist = exerciseHistory(sessions.filter((s) => s.id !== session.id && toDate(s.startedAt) < t), exerciseId);
    const prev = hist.length ? hist[hist.length - 1] : null;
    if (!prev) return null;
    return Object.assign({ previousDate: prev.date, previousSessionId: prev.sessionId }, compareSetLists(prev.sets, after));
  }

  /** Compara dos sesiones completas (por ejemplo, dos días de pecho). */
  function compareSessions(a, b) {
    const ids = [];
    for (const s of [a, b]) for (const e of s.exercises || []) if (!ids.includes(e.exerciseId)) ids.push(e.exerciseId);
    const exercises = ids.map((id) => {
      const sa = (a.exercises || []).filter((e) => e.exerciseId === id).flatMap(workSets);
      const sb = (b.exercises || []).filter((e) => e.exerciseId === id).flatMap(workSets);
      return { exerciseId: id, inBefore: sa.length > 0, inAfter: sb.length > 0, comparison: compareSetLists(sa, sb) };
    });
    const vA = sessionVolume(a), vB = sessionVolume(b);
    const wA = sessionWorkSetCount(a), wB = sessionWorkSetCount(b);
    return {
      exercises,
      totals: {
        volume: { before: vA, after: vB, diff: vB - vA, pct: pctChange(vA, vB) },
        sets: { before: wA, after: wB, diff: wB - wA, pct: pctChange(wA, wB) },
        duration: { before: durationMinutes(a), after: durationMinutes(b), diff: durationMinutes(b) - durationMinutes(a), pct: pctChange(durationMinutes(a), durationMinutes(b)) },
      },
    };
  }

  // ---------- récords personales ----------
  /**
   * Recorre las sesiones terminadas en orden y devuelve los récords conseguidos.
   * La primera vez que se hace un ejercicio no cuenta como récord (no hay referencia).
   * Tipos: 'weight' (peso máximo), 'e1rm' (1RM estimado, series de ≤12 reps), 'volume' (volumen del ejercicio en la sesión).
   */
  function computePRs(sessions) {
    const best = {}; // exerciseId -> {weight, e1rm, volume}
    const events = [];
    for (const s of doneSessions(sessions)) {
      const byEx = {};
      for (const e of s.exercises || []) {
        const ws = workSets(e);
        if (!ws.length) continue;
        (byEx[e.exerciseId] = byEx[e.exerciseId] || []).push(...ws);
      }
      for (const exId of Object.keys(byEx)) {
        const sets = byEx[exId];
        const top = topSet(sets);
        const e1 = bestE1RMOfSets(sets);
        const vol = sets.reduce((a, x) => a + x.weight * x.reps, 0);
        const b = best[exId];
        if (b) {
          if (top.weight > b.weight) events.push({ sessionId: s.id, date: s.startedAt, exerciseId: exId, type: 'weight', value: top.weight, reps: top.reps, previous: b.weight });
          if (e1.value > 0 && e1.value > b.e1rm + 1e-9 && b.e1rm > 0) events.push({ sessionId: s.id, date: s.startedAt, exerciseId: exId, type: 'e1rm', value: e1.value, previous: b.e1rm });
          if (vol > b.volume) events.push({ sessionId: s.id, date: s.startedAt, exerciseId: exId, type: 'volume', value: vol, previous: b.volume });
          b.weight = Math.max(b.weight, top.weight);
          b.e1rm = Math.max(b.e1rm, e1.value);
          b.volume = Math.max(b.volume, vol);
        } else {
          best[exId] = { weight: top.weight, e1rm: e1.value, volume: vol };
        }
      }
    }
    return events;
  }

  /** Mejores marcas previas a una fecha, para detectar récords en directo durante una sesión. */
  function bestsBefore(sessions, exerciseId, beforeDate, excludeSessionId) {
    const t = beforeDate ? toDate(beforeDate) : null;
    const hist = exerciseHistory(sessions.filter((s) => s.id !== excludeSessionId && (!t || toDate(s.startedAt) < t)), exerciseId);
    if (!hist.length) return null;
    return {
      weight: Math.max(...hist.map((h) => h.topWeight)),
      e1rm: Math.max(...hist.map((h) => h.e1rm)),
      volume: Math.max(...hist.map((h) => h.volume)),
    };
  }

  // ---------- agregados ----------
  /** Agrupa sesiones terminadas por semana o mes. exerciseGroup(id) devuelve el grupo muscular. */
  function aggregate(sessions, by, exerciseGroup) {
    const keyFn = by === 'month' ? monthKey : weekKey;
    const map = new Map();
    for (const s of doneSessions(sessions)) {
      const k = keyFn(s.startedAt);
      if (!map.has(k)) map.set(k, { key: k, sessions: 0, workSets: 0, volume: 0, minutes: 0, byGroup: {} });
      const a = map.get(k);
      a.sessions++;
      a.minutes += durationMinutes(s);
      for (const e of s.exercises || []) {
        const ws = workSets(e);
        const v = ws.reduce((x, y) => x + y.weight * y.reps, 0);
        a.workSets += ws.length;
        a.volume += v;
        const g = exerciseGroup ? exerciseGroup(e.exerciseId) : 'otro';
        a.byGroup[g] = (a.byGroup[g] || 0) + v;
      }
    }
    return Array.from(map.values()).sort((x, y) => (x.key < y.key ? -1 : 1));
  }

  /** Serie continua de semanas (incluye semanas sin entrenar con 0) entre dos fechas. */
  function weeklySeries(sessions, from, to, exerciseGroup) {
    const agg = new Map(aggregate(sessions, 'week', exerciseGroup).map((a) => [a.key, a]));
    const out = [];
    let w = startOfWeek(from);
    const end = startOfWeek(to);
    let guard = 0;
    while (w <= end && guard++ < 600) {
      const k = dayKey(w);
      out.push(agg.get(k) || { key: k, sessions: 0, workSets: 0, volume: 0, minutes: 0, byGroup: {} });
      w = addDays(w, 7);
    }
    return out;
  }

  function volumeByGroup(sessions, exerciseGroup, period, now = new Date()) {
    const out = {};
    for (const s of doneSessions(sessions)) {
      if (!inPeriod(s.startedAt, period, now)) continue;
      for (const e of s.exercises || []) {
        const g = exerciseGroup(e.exerciseId);
        const ws = workSets(e);
        if (!ws.length) continue;
        if (!out[g]) out[g] = { volume: 0, sets: 0 };
        out[g].volume += entryVolume(e);
        out[g].sets += ws.length;
      }
    }
    return out;
  }

  /** Actividad por día (para calendario y mapa de constancia). */
  function dailyActivity(sessions) {
    const map = {};
    for (const s of doneSessions(sessions)) {
      const k = dayKey(s.startedAt);
      if (!map[k]) map[k] = { sessions: 0, workSets: 0, volume: 0, types: [] };
      map[k].sessions++;
      map[k].workSets += sessionWorkSetCount(s);
      map[k].volume += sessionVolume(s);
      if (!map[k].types.includes(s.type)) map[k].types.push(s.type);
    }
    return map;
  }

  /** Nivel de intensidad 0–4 de un día según las series de trabajo, relativo a tu propio historial. */
  function intensityLevel(workSetsCount, maxWorkSets) {
    if (!workSetsCount) return 0;
    if (!maxWorkSets) return 1;
    const r = workSetsCount / maxWorkSets;
    if (r > 0.75) return 4;
    if (r > 0.5) return 3;
    if (r > 0.25) return 2;
    return 1;
  }

  /** Semanas consecutivas con al menos una sesión. current: racha que llega a esta semana (o a la anterior). */
  function weekStreaks(sessions, now = new Date()) {
    const weeks = new Set(doneSessions(sessions).map((s) => weekKey(s.startedAt)));
    if (!weeks.size) return { current: 0, best: 0 };
    const sorted = Array.from(weeks).sort();
    let best = 1, run = 1;
    for (let i = 1; i < sorted.length; i++) {
      const prev = toDate(sorted[i - 1] + 'T00:00:00');
      const cur = toDate(sorted[i] + 'T00:00:00');
      const diffWeeks = Math.round((cur - prev) / (7 * DAY));
      run = diffWeeks === 1 ? run + 1 : 1;
      best = Math.max(best, run);
    }
    // racha actual: cuenta hacia atrás desde esta semana; si esta semana aún no hay sesión, desde la anterior
    let w = startOfWeek(now);
    if (!weeks.has(dayKey(w))) w = addDays(w, -7);
    let current = 0;
    while (weeks.has(dayKey(w))) { current++; w = addDays(w, -7); }
    return { current, best };
  }

  function daysSinceLast(sessions, now = new Date()) {
    const d = doneSessions(sessions);
    if (!d.length) return null;
    const last = startOfDay(d[d.length - 1].startedAt);
    return Math.round((startOfDay(now) - last) / DAY);
  }

  /** Resumen de una ventana de tiempo [from, to). */
  function windowSummary(sessions, from, to) {
    const ss = doneSessions(sessions).filter((s) => toDate(s.startedAt) >= from && toDate(s.startedAt) < to);
    return {
      sessions: ss.length,
      volume: ss.reduce((a, s) => a + sessionVolume(s), 0),
      workSets: ss.reduce((a, s) => a + sessionWorkSetCount(s), 0),
      minutes: ss.reduce((a, s) => a + durationMinutes(s), 0),
    };
  }

  // ---------- logros y niveles ----------
  const ACHIEVEMENTS = [
    { id: 'first', name: 'Primera piedra', desc: 'Registra tu primera sesión.', test: (c) => c.sessions >= 1 },
    { id: 's10', name: 'Diez de diez', desc: 'Completa 10 sesiones.', test: (c) => c.sessions >= 10 },
    { id: 's50', name: 'Medio centenar', desc: 'Completa 50 sesiones.', test: (c) => c.sessions >= 50 },
    { id: 's100', name: 'Club de los cien', desc: 'Completa 100 sesiones.', test: (c) => c.sessions >= 100 },
    { id: 'pr1', name: 'Primer récord', desc: 'Supera por primera vez una marca de peso o de 1RM estimado.', test: (c) => c.strengthPRs >= 1 },
    { id: 'pr10', name: 'Coleccionista de PR', desc: 'Consigue 10 récords de peso o de 1RM estimado.', test: (c) => c.strengthPRs >= 10 },
    { id: 'w4', name: 'Cuatro semanas seguidas', desc: 'Entrena al menos una vez por semana durante 4 semanas consecutivas.', test: (c) => c.bestStreak >= 4 },
    { id: 'w12', name: 'Trimestre de hierro', desc: '12 semanas consecutivas con al menos una sesión.', test: (c) => c.bestStreak >= 12 },
    { id: 'sets100', name: 'Cien series', desc: 'Registra 100 series de trabajo.', test: (c) => c.workSets >= 100 },
    { id: 'sets1000', name: 'Mil series', desc: 'Registra 1000 series de trabajo.', test: (c) => c.workSets >= 1000 },
    { id: 'vol', name: 'Récord de volumen', desc: 'Supera tu volumen previo en un ejercicio.', test: (c) => c.volumePRs >= 1 },
    { id: 'all5', name: 'Cuerpo completo', desc: 'Trabaja hombros, pecho, espalda, brazos y piernas.', test: (c) => c.groupsTrained >= 5 },
    { id: 'ex10', name: 'Repertorio', desc: 'Registra 10 ejercicios distintos.', test: (c) => c.distinctExercises >= 10 },
  ];

  const LEVEL_TITLES = ['Recién llegado', 'Aprendiz del hierro', 'Habitual del rack', 'Veterano de la barra', 'Leyenda del gimnasio', 'Mito del disco'];

  function achievementContext(sessions, exerciseGroup) {
    const done = doneSessions(sessions);
    const prs = computePRs(sessions);
    const groups = new Set(), exs = new Set();
    let ws = 0;
    for (const s of done) {
      for (const e of s.exercises || []) {
        const n = workSets(e).length;
        if (!n) continue;
        ws += n;
        exs.add(e.exerciseId);
        if (exerciseGroup) groups.add(exerciseGroup(e.exerciseId));
      }
    }
    const strength = new Set(prs.filter((p) => p.type !== 'volume').map((p) => p.sessionId + ':' + p.exerciseId));
    return {
      sessions: done.length,
      workSets: ws,
      strengthPRs: strength.size,
      volumePRs: prs.filter((p) => p.type === 'volume').length,
      bestStreak: weekStreaks(sessions).best,
      groupsTrained: ['hombros', 'pecho', 'espalda', 'brazos', 'piernas'].filter((g) => groups.has(g)).length,
      distinctExercises: exs.size,
    };
  }

  /**
   * Nivel: premia la constancia (sesiones y semanas activas) y los récords, no la carga total.
   * XP = 10 por sesión + 5 por semana activa + 15 por récord de fuerza.
   */
  function levelInfo(ctx, activeWeeks) {
    const xp = ctx.sessions * 10 + activeWeeks * 5 + ctx.strengthPRs * 15;
    let level = 1;
    while (xp >= xpForLevel(level + 1)) level++;
    const cur = xpForLevel(level), next = xpForLevel(level + 1);
    return {
      xp, level,
      title: LEVEL_TITLES[Math.min(LEVEL_TITLES.length - 1, Math.floor((level - 1) / 3))],
      progress: (xp - cur) / (next - cur),
      toNext: next - xp,
    };
  }
  function xpForLevel(l) { return l <= 1 ? 0 : Math.round(50 * Math.pow(l - 1, 1.6)); }

  function evaluateAchievements(sessions, exerciseGroup) {
    const ctx = achievementContext(sessions, exerciseGroup);
    const activeWeeks = new Set(doneSessions(sessions).map((s) => weekKey(s.startedAt))).size;
    return {
      ctx,
      level: levelInfo(ctx, activeWeeks),
      list: ACHIEVEMENTS.map((a) => ({ id: a.id, name: a.name, desc: a.desc, unlocked: a.test(ctx) })),
    };
  }

  // ---------- importación / exportación ----------
  const EXPORT_FORMAT = 'gymtracker-backup';

  function isIsoDate(v) { return typeof v === 'string' && !Number.isNaN(Date.parse(v)); }

  /** Valida una copia de seguridad antes de tocar nada. Devuelve {ok, errors, data}. */
  function validateBackup(obj) {
    const errors = [];
    if (!obj || typeof obj !== 'object') return { ok: false, errors: ['El archivo no contiene un objeto JSON.'] };
    if (obj.format !== EXPORT_FORMAT) errors.push('No parece una copia de GymTracker (falta "format": "' + EXPORT_FORMAT + '").');
    if (!Array.isArray(obj.sessions)) errors.push('Falta la lista "sessions".');
    if (!Array.isArray(obj.exercises)) errors.push('Falta la lista "exercises".');
    if (errors.length) return { ok: false, errors };

    const exIds = new Set();
    obj.exercises.forEach((e, i) => {
      const at = 'Ejercicio ' + (i + 1);
      if (!e || typeof e.id !== 'string' || !e.id) errors.push(at + ': falta el id.');
      else exIds.add(e.id);
      if (!e || typeof e.name !== 'string' || !e.name.trim()) errors.push(at + ': falta el nombre.');
      if (e && e.group !== undefined && !GROUPS.includes(e.group)) errors.push(at + ': grupo muscular desconocido "' + e.group + '".');
      if (e && e.muscles !== undefined && !validMuscleMap(e.muscles)) errors.push(at + ': lista de músculos no válida.');
    });
    obj.sessions.forEach((s, i) => {
      const at = 'Sesión ' + (i + 1);
      if (!s || typeof s.id !== 'string' || !s.id) { errors.push(at + ': falta el id.'); return; }
      if (!isIsoDate(s.startedAt)) errors.push(at + ': fecha de inicio no válida.');
      if (s.endedAt != null && !isIsoDate(s.endedAt)) errors.push(at + ': fecha de fin no válida.');
      if (!SESSION_TYPES.includes(s.type)) errors.push(at + ': tipo de día desconocido "' + s.type + '".');
      if (!Array.isArray(s.exercises)) { errors.push(at + ': falta la lista de ejercicios.'); return; }
      s.exercises.forEach((e, j) => {
        const at2 = at + ', ejercicio ' + (j + 1);
        if (!e || typeof e.exerciseId !== 'string') { errors.push(at2 + ': falta exerciseId.'); return; }
        if (!exIds.has(e.exerciseId)) errors.push(at2 + ': hace referencia a un ejercicio que no está en el archivo.');
        if (!Array.isArray(e.sets)) { errors.push(at2 + ': falta la lista de series.'); return; }
        e.sets.forEach((st, k) => {
          const at3 = at2 + ', serie ' + (k + 1);
          if (!st || typeof st !== 'object') { errors.push(at3 + ': no válida.'); return; }
          if (st.weight !== null && (typeof st.weight !== 'number' || validateWeight(st.weight))) errors.push(at3 + ': peso no válido.');
          if (st.reps !== null && (typeof st.reps !== 'number' || validateReps(st.reps))) errors.push(at3 + ': repeticiones no válidas.');
          if (st.kind !== undefined && !SET_KINDS.includes(st.kind)) errors.push(at3 + ': tipo de serie desconocido.');
        });
      });
    });
    if (errors.length > 50) errors.splice(50, errors.length - 50, 'Hay más errores; se muestran los 50 primeros.');
    return { ok: errors.length === 0, errors, data: errors.length ? null : obj };
  }

  function normName(n) {
    return String(n || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
  }
  function sessionFingerprint(s) {
    const sets = (s.exercises || []).map((e) => (e.sets || []).map((x) => x.weight + 'x' + x.reps).join(',')).join('|');
    return s.type + '@' + toDate(s.startedAt).toISOString().slice(0, 16) + '#' + sets;
  }

  /**
   * Planifica la fusión de una copia válida con los datos actuales, sin modificar nada.
   * - Ejercicios: mismo id o mismo nombre normalizado → se reutiliza el existente.
   * - Sesiones: mismo id o misma huella (tipo, minuto de inicio y series) → duplicado, se omite.
   * Devuelve {exercisesToAdd, sessionsToAdd, duplicateSessions, idMap}.
   */
  function planImport(current, backup) {
    const byId = new Map(current.exercises.map((e) => [e.id, e]));
    const byName = new Map(current.exercises.map((e) => [normName(e.name), e]));
    const idMap = {};
    const exercisesToAdd = [];
    for (const e of backup.exercises) {
      const match = byId.get(e.id) || byName.get(normName(e.name));
      if (match) { idMap[e.id] = match.id; continue; }
      const copy = Object.assign({ group: 'otro', custom: true, favorite: false }, e);
      exercisesToAdd.push(copy);
      byId.set(copy.id, copy); byName.set(normName(copy.name), copy);
      idMap[e.id] = copy.id;
    }
    const sessionIds = new Set(current.sessions.map((s) => s.id));
    const fps = new Set(current.sessions.map(sessionFingerprint));
    const sessionsToAdd = [];
    let duplicateSessions = 0;
    for (const s of backup.sessions) {
      const remapped = Object.assign({}, s, {
        exercises: s.exercises.map((e) => Object.assign({}, e, { exerciseId: idMap[e.exerciseId] || e.exerciseId })),
      });
      const fp = sessionFingerprint(remapped);
      if (sessionIds.has(s.id) || fps.has(fp)) { duplicateSessions++; continue; }
      sessionIds.add(s.id); fps.add(fp);
      sessionsToAdd.push(remapped);
    }
    return { exercisesToAdd, sessionsToAdd, duplicateSessions, idMap };
  }

  function csvEscape(v) {
    const s = v === null || v === undefined ? '' : String(v);
    return /[";\n,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  /** CSV con una fila por serie (pesos en kg). */
  function toCSV(sessions, exerciseName) {
    const head = ['fecha', 'hora', 'tipo_dia', 'duracion_min', 'ejercicio', 'orden_ejercicio', 'serie', 'tipo_serie', 'peso_kg', 'repeticiones', 'completada', 'volumen_kg', 'notas_sesion'];
    const rows = [head.join(',')];
    for (const s of doneSessions(sessions)) {
      const d = toDate(s.startedAt);
      (s.exercises || []).forEach((e, i) => {
        (e.sets || []).forEach((st, k) => {
          rows.push([
            dayKey(d), pad(d.getHours()) + ':' + pad(d.getMinutes()), s.type, durationMinutes(s),
            exerciseName(e.exerciseId), i + 1, k + 1, st.kind || 'normal',
            st.weight ?? '', st.reps ?? '', st.done ? 'si' : 'no', round(setVolume(st), 2), s.notes || '',
          ].map(csvEscape).join(','));
        });
      });
    }
    return rows.join('\n');
  }

  // ---------- progresión doble ----------
  const DEFAULT_PROGRESSION = { repMin: 8, repMax: 12, increment: 2.5 };
  function progressionConfig(ex) {
    const c = Object.assign({}, DEFAULT_PROGRESSION);
    if (ex) {
      if (Number.isInteger(ex.repMin) && ex.repMin > 0) c.repMin = ex.repMin;
      if (Number.isInteger(ex.repMax) && ex.repMax >= c.repMin) c.repMax = ex.repMax;
      if (typeof ex.increment === 'number' && ex.increment > 0) c.increment = ex.increment;
    }
    if (c.repMax < c.repMin) c.repMax = c.repMin;
    return c;
  }
  /**
   * Sugerencia de progresión doble a partir de las últimas ejecuciones (de más antigua a más reciente).
   * Usa las series de trabajo normales (sin calentamiento ni descarga) con el peso más alto de la última vez.
   * - Todas llegan al máximo del rango → subir el incremento y volver al mínimo del rango.
   * - Alguna queda por debajo del mínimo dos veces seguidas con ese peso → bajar un incremento.
   * - Alguna queda por debajo del mínimo → mantener el peso y buscar el mínimo.
   * - Si no → mantener el peso y sumar una repetición a la serie más floja.
   */
  function suggestProgression(executions, cfg) {
    cfg = Object.assign({}, DEFAULT_PROGRESSION, cfg || {});
    const main = (ex) => (ex ? ex.sets.filter((s) => s.kind !== 'drop' && s.kind !== 'warmup') : []);
    const last = main(executions[executions.length - 1]);
    if (!last.length) return null;
    const W = Math.max(...last.map((s) => s.weight));
    const atW = last.filter((s) => Math.abs(s.weight - W) < 1e-6);
    const reps = atW.map((s) => s.reps);
    const minR = Math.min(...reps);
    const base = { basedOn: { weight: W, reps, sets: atW.length }, config: cfg };
    if (reps.every((r) => r >= cfg.repMax)) {
      return Object.assign(base, { action: 'increase', weight: round(W + cfg.increment, 2), reps: cfg.repMin });
    }
    if (minR < cfg.repMin) {
      const prev = main(executions[executions.length - 2]);
      const prevAtW = prev.filter((s) => Math.abs(s.weight - W) < 1e-6);
      if (prevAtW.length && Math.min(...prevAtW.map((s) => s.reps)) < cfg.repMin && W - cfg.increment > 0) {
        return Object.assign(base, { action: 'reduce', weight: round(W - cfg.increment, 2), reps: cfg.repMin });
      }
      return Object.assign(base, { action: 'hold', weight: W, reps: cfg.repMin });
    }
    return Object.assign(base, { action: 'reps', weight: W, reps: Math.min(cfg.repMax, minR + 1) });
  }

  // ---------- estancamiento ----------
  /** Marca de fuerza de una ejecución: 1RM estimado si hay series de ≤12 reps; si no, el peso máximo. */
  function strengthScore(h) { return h.e1rm > 0 ? h.e1rm : h.topWeight; }
  /**
   * Ejercicios que llevan varias sesiones sin superar su mejor marca de fuerza.
   * Requiere: al menos minSessions ejecuciones desde la última mejora, al menos minDays días desde ella,
   * y que el ejercicio se siga haciendo (última vez hace ≤ activeDays días).
   */
  function detectStalls(sessions, now = new Date(), opts = {}) {
    const o = Object.assign({ minSessions: 3, minDays: 21, activeDays: 35 }, opts);
    const ids = new Set();
    for (const s of doneSessions(sessions)) for (const e of s.exercises || []) ids.add(e.exerciseId);
    const out = [];
    for (const id of ids) {
      const hist = exerciseHistory(sessions, id);
      if (hist.length < o.minSessions + 1) continue;
      let best = -Infinity, lastIdx = 0;
      hist.forEach((h, i) => { const sc = strengthScore(h); if (sc > best + 1e-9) { best = sc; lastIdx = i; } });
      const since = hist.length - 1 - lastIdx;
      const daysSince = Math.floor((startOfDay(now) - startOfDay(hist[lastIdx].date)) / DAY);
      const daysIdle = Math.floor((startOfDay(now) - startOfDay(hist[hist.length - 1].date)) / DAY);
      if (since >= o.minSessions && daysSince >= o.minDays && daysIdle <= o.activeDays) {
        out.push({ exerciseId: id, sessionsSince: since, daysSince, bestScore: best, bestDate: hist[lastIdx].date, usesE1RM: hist[lastIdx].e1rm > 0 });
      }
    }
    return out.sort((a, b) => b.daysSince - a.daysSince);
  }

  // ---------- series por grupo en una ventana ----------
  function groupSetsBetween(sessions, exerciseGroup, from, to) {
    const out = {};
    for (const s of doneSessions(sessions)) {
      const t = toDate(s.startedAt);
      if (t < from || t >= to) continue;
      for (const e of s.exercises || []) {
        const ws = workSets(e);
        if (!ws.length) continue;
        const g = exerciseGroup(e.exerciseId);
        if (!out[g]) out[g] = { sets: 0, volume: 0 };
        out[g].sets += ws.length;
        out[g].volume += ws.reduce((a, x) => a + x.weight * x.reps, 0);
      }
    }
    return out;
  }
  /**
   * Series por músculo en [from, to). exerciseMuscles(id) → {músculo: 1 | 0,5}.
   * Cada serie de trabajo suma 1 a sus músculos principales y 0,5 a los secundarios (series fraccionadas).
   * Devuelve {músculo: {sets, direct, indirect, byExercise: {id: series ponderadas}}}.
   */
  function muscleSetsBetween(sessions, exerciseMuscles, from, to) {
    const out = {};
    for (const s of doneSessions(sessions)) {
      const t = toDate(s.startedAt);
      if ((from && t < from) || (to && t >= to)) continue;
      for (const e of s.exercises || []) {
        const n = workSets(e).length;
        if (!n) continue;
        const ms = exerciseMuscles(e.exerciseId) || {};
        for (const m of Object.keys(ms)) {
          const w = ms[m];
          if (!(w > 0)) continue;
          if (!out[m]) out[m] = { sets: 0, direct: 0, indirect: 0, byExercise: {} };
          out[m].sets += n * w;
          if (w >= 1) out[m].direct += n; else out[m].indirect += n;
          out[m].byExercise[e.exerciseId] = (out[m].byExercise[e.exerciseId] || 0) + n * w;
        }
      }
    }
    return out;
  }
  function validMuscleMap(obj) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
    return Object.keys(obj).every((k) => MUSCLES.includes(k) && MUSCLE_ROLES.includes(obj[k]));
  }
  /** Nivel de color 0–4 según series semanales de un grupo. */
  function weeklySetsLevel(sets) {
    if (!(sets > 0)) return 0;
    if (sets < 5) return 1;
    if (sets < 10) return 2;
    if (sets <= 20) return 3;
    return 4;
  }

  // ---------- resumen mensual ----------
  function monthRecap(sessions, exerciseGroup, monthDate) {
    const from = startOfMonth(monthDate), to = addMonths(from, 1);
    const pFrom = addMonths(from, -1);
    const all = doneSessions(sessions);
    const inM = all.filter((s) => toDate(s.startedAt) >= from && toDate(s.startedAt) < to);
    const sum = windowSummary(sessions, from, to);
    const prev = windowSummary(sessions, pFrom, from);
    const count = (arr) => { const m = {}; arr.forEach((k) => { m[k] = (m[k] || 0) + 1; }); return m; };
    const top = (m) => { const k = Object.keys(m).sort((a, b) => m[b] - m[a])[0]; return k === undefined ? null : { key: k, count: m[k] }; };
    const days = new Set(inM.map((s) => dayKey(s.startedAt)));
    const exCount = {};
    let heaviest = null;
    inM.forEach((s) => {
      new Set((s.exercises || []).filter((e) => workSets(e).length).map((e) => e.exerciseId)).forEach((id) => { exCount[id] = (exCount[id] || 0) + 1; });
      (s.exercises || []).forEach((e) => workSets(e).forEach((x) => {
        if (!heaviest || x.weight > heaviest.weight) heaviest = { exerciseId: e.exerciseId, weight: x.weight, reps: x.reps, date: s.startedAt };
      }));
    });
    const groups = groupSetsBetween(sessions, exerciseGroup, from, to);
    const topGroupKey = Object.keys(groups).sort((a, b) => groups[b].sets - groups[a].sets)[0];
    const prs = computePRs(sessions).filter((p) => toDate(p.date) >= from && toDate(p.date) < to);
    // ejercicio estrella: mayor mejora % de la marca de fuerza del mes frente a todo lo anterior
    let star = null;
    for (const id of Object.keys(exCount)) {
      const hist = exerciseHistory(sessions, id);
      const before = hist.filter((h) => toDate(h.date) < from);
      const during = hist.filter((h) => toDate(h.date) >= from && toDate(h.date) < to);
      if (!before.length || !during.length) continue;
      const b = Math.max(...before.map(strengthScore));
      const d = Math.max(...during.map(strengthScore));
      const pct = pctChange(b, d);
      if (pct !== null && pct > 0 && (!star || pct > star.pct)) star = { exerciseId: id, before: b, after: d, pct, usesE1RM: during.some((h) => h.e1rm > 0) };
    }
    const weekdays = count(inM.map((s) => (toDate(s.startedAt).getDay() + 6) % 7));
    const longest = inM.reduce((a, s) => Math.max(a, durationMinutes(s)), 0);
    return {
      month: from,
      sessions: sum.sessions, days: days.size, minutes: sum.minutes, workSets: sum.workSets, volume: sum.volume,
      previous: prev,
      topType: top(count(inM.map((s) => s.type))),
      topWeekday: top(weekdays),
      topExercise: top(exCount),
      topGroup: topGroupKey ? { key: topGroupKey, sets: groups[topGroupKey].sets } : null,
      groups,
      strengthPRs: prs.filter((p) => p.type !== 'volume'),
      volumePRs: prs.filter((p) => p.type === 'volume'),
      star, heaviest, longestSession: longest,
      distinctExercises: Object.keys(exCount).length,
    };
  }

  // ---------- resumen compartible con amigos ----------
  const SOCIAL_VERSION = 1;
  function windowWithPRs(sessions, from, to, prs) {
    const w = windowSummary(sessions, from, to);
    const days = new Set(doneSessions(sessions).filter((s) => toDate(s.startedAt) >= from && toDate(s.startedAt) < to).map((s) => dayKey(s.startedAt)));
    w.days = days.size;
    w.prs = new Set(prs.filter((p) => p.type !== 'volume' && toDate(p.date) >= from && toDate(p.date) < to).map((p) => p.sessionId + ':' + p.exerciseId)).size;
    return w;
  }
  /**
   * Resumen que se comparte con el grupo. No incluye sesiones ni series sueltas.
   * helpers: {exerciseName(id), exerciseMuscles(id), exerciseGroup(id)}
   * opts: {weights: false} quita todos los kilos (deja solo recuentos y porcentajes).
   */
  function buildSocialSummary(sessions, helpers, now = new Date(), opts = {}) {
    const ds = doneSessions(sessions);
    const prs = computePRs(sessions);
    const wk = startOfWeek(now), mo = startOfMonth(now);
    const ach = evaluateAchievements(sessions, helpers.exerciseGroup);
    const st = weekStreaks(sessions, now);
    // ejercicios principales: los más frecuentes en los últimos 90 días
    const since90 = addDays(startOfDay(now), -90);
    const freq = {};
    ds.filter((s) => toDate(s.startedAt) >= since90).forEach((s) => {
      new Set((s.exercises || []).filter((e) => workSets(e).length).map((e) => e.exerciseId)).forEach((id) => { freq[id] = (freq[id] || 0) + 1; });
    });
    const d30 = addDays(startOfDay(now), -30);
    const lifts = Object.keys(freq).sort((a, b) => freq[b] - freq[a]).slice(0, 8).map((id) => {
      const hist = exerciseHistory(sessions, id);
      const best = hist.reduce((b, h) => (strengthScore(h) > (b ? strengthScore(b) : -1) ? h : b), null);
      const last = hist[hist.length - 1];
      const before = hist.filter((h) => toDate(h.date) < d30);
      const within = hist.filter((h) => toDate(h.date) >= d30);
      let change30 = null;
      if (before.length && within.length) {
        const from = Math.max(...before.map(strengthScore)), to = Math.max(...within.map(strengthScore));
        change30 = { pct: round(pctChange(from, to), 1), from: round(from, 1), to: round(to, 1) };
      }
      return {
        name: helpers.exerciseName(id),
        sessions: hist.length,
        best: { score: round(strengthScore(best), 1), e1rm: best.e1rm > 0, weight: best.topSet.weight, reps: best.topSet.reps, date: dayKey(best.date) },
        last: { score: round(strengthScore(last), 1), date: dayKey(last.date) },
        change30,
      };
    });
    const nameOf = (id) => helpers.exerciseName(id);
    const recentPRs = prs.filter((p) => p.type !== 'volume').slice(-8).reverse()
      .map((p) => ({ name: nameOf(p.exerciseId), type: p.type, value: round(p.value, 1), reps: p.reps || null, date: dayKey(p.date) }));
    const msets = (from, to, div) => {
      const r = muscleSetsBetween(sessions, helpers.exerciseMuscles, from, to);
      const o = {};
      Object.keys(r).forEach((m) => { if (r[m].sets > 0) o[m] = round(r[m].sets / div, 1); });
      return o;
    };
    const last = ds[ds.length - 1];
    let summary = {
      v: SOCIAL_VERSION,
      generatedAt: toDate(now).toISOString(),
      weights: opts.weights !== false,
      totals: { sessions: ds.length, workSets: ds.reduce((a, s) => a + sessionWorkSetCount(s), 0), volume: round(ds.reduce((a, s) => a + sessionVolume(s), 0), 0), since: ds.length ? dayKey(ds[0].startedAt) : null },
      week: Object.assign({ key: dayKey(wk) }, windowWithPRs(sessions, wk, addDays(wk, 7), prs)),
      prevWeek: Object.assign({ key: dayKey(addDays(wk, -7)) }, windowWithPRs(sessions, addDays(wk, -7), wk, prs)),
      month: Object.assign({ key: monthKey(mo) }, windowWithPRs(sessions, mo, addMonths(mo, 1), prs)),
      prevMonth: Object.assign({ key: monthKey(addMonths(mo, -1)) }, windowWithPRs(sessions, addMonths(mo, -1), mo, prs)),
      streak: st,
      last: last ? { date: dayKey(last.startedAt), type: last.type } : null,
      level: { level: ach.level.level, title: ach.level.title },
      achievements: ach.list.filter((a) => a.unlocked).length,
      lifts,
      prs: recentPRs,
      muscles: { week: msets(wk, addDays(wk, 7), 1), avg4: msets(addDays(wk, -28), wk, 4) },
    };
    if (opts.weights === false) summary = stripWeights(summary);
    return summary;
  }
  function stripWeights(s) {
    const c = JSON.parse(JSON.stringify(s));
    c.weights = false;
    delete c.totals.volume;
    ['week', 'prevWeek', 'month', 'prevMonth'].forEach((k) => { delete c[k].volume; });
    c.lifts.forEach((l) => {
      delete l.best.score; delete l.best.weight; delete l.last.score;
      if (l.change30) { delete l.change30.from; delete l.change30.to; }
    });
    c.prs.forEach((p) => { delete p.value; });
    return c;
  }

  // ---------- limpieza de datos que llegan de otras personas ----------
  // Todo lo que viene del servidor se trata como no fiable: se reconstruye campo a campo,
  // con tipos, rangos y longitudes fijos. Lo que no encaja se descarta.
  const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
  function cleanNum(x, min, max, dec) {
    const n = typeof x === 'number' ? x : NaN;
    if (!Number.isFinite(n) || n < min || n > max) return null;
    return dec === 0 ? Math.round(n) : round(n, dec === undefined ? 2 : dec);
  }
  function cleanStr(x, max) {
    if (typeof x !== 'string') return '';
    return x.replace(/[\u0000-\u001f\u007f​-‏‪-‮⁦-⁩]/g, '').trim().slice(0, max);
  }
  function cleanDay(x) { return typeof x === 'string' && DAY_RE.test(x) && !Number.isNaN(Date.parse(x + 'T12:00:00')) ? x : null; }
  function cleanIso(x) { return typeof x === 'string' && x.length <= 40 && !Number.isNaN(Date.parse(x)) ? x : null; }
  function cleanWindow(w, withKey) {
    if (!w || typeof w !== 'object') return null;
    const key = withKey === 'month' ? (typeof w.key === 'string' && /^\d{4}-\d{2}$/.test(w.key) ? w.key : null) : cleanDay(w.key);
    if (!key) return null;
    const o = { key, sessions: cleanNum(w.sessions, 0, 1000, 0) || 0, workSets: cleanNum(w.workSets, 0, 100000, 0) || 0,
      minutes: cleanNum(w.minutes, 0, 1e6, 0) || 0, days: cleanNum(w.days, 0, 31, 0) || 0, prs: cleanNum(w.prs, 0, 10000, 0) || 0 };
    const v = cleanNum(w.volume, 0, 1e9, 0);
    if (v !== null) o.volume = v;
    return o;
  }
  /** Devuelve una copia segura de un resumen recibido, o {} si no es válido. */
  function sanitizeSummary(s) {
    if (!s || typeof s !== 'object' || Array.isArray(s)) return {};
    if (s.hidden === true) return { v: 1, hidden: true };
    if (s.v !== SOCIAL_VERSION) return {};
    const out = { v: SOCIAL_VERSION, weights: s.weights !== false, generatedAt: cleanIso(s.generatedAt) };
    const t = s.totals || {};
    out.totals = { sessions: cleanNum(t.sessions, 0, 100000, 0) || 0, workSets: cleanNum(t.workSets, 0, 1e7, 0) || 0, since: cleanDay(t.since) };
    if (out.weights && cleanNum(t.volume, 0, 1e10, 0) !== null) out.totals.volume = cleanNum(t.volume, 0, 1e10, 0);
    ['week', 'prevWeek'].forEach((k) => { const w = cleanWindow(s[k], 'week'); if (w) out[k] = w; });
    ['month', 'prevMonth'].forEach((k) => { const w = cleanWindow(s[k], 'month'); if (w) out[k] = w; });
    const st = s.streak || {};
    out.streak = { current: cleanNum(st.current, 0, 1000, 0) || 0, best: cleanNum(st.best, 0, 1000, 0) || 0 };
    if (s.last && cleanDay(s.last.date)) out.last = { date: cleanDay(s.last.date), type: SESSION_TYPES.includes(s.last.type) ? s.last.type : 'mixto' };
    if (s.level) out.level = { level: cleanNum(s.level.level, 1, 1000, 0) || 1, title: cleanStr(s.level.title, 40) };
    out.achievements = cleanNum(s.achievements, 0, 100, 0) || 0;
    out.lifts = (Array.isArray(s.lifts) ? s.lifts : []).slice(0, 8).map((l) => {
      if (!l || typeof l !== 'object') return null;
      const name = cleanStr(l.name, 80);
      if (!name) return null;
      const b = l.best || {}, la = l.last || {};
      const o = { name, sessions: cleanNum(l.sessions, 0, 100000, 0) || 0, best: { e1rm: b.e1rm === true, reps: cleanNum(b.reps, 0, 500, 0), date: cleanDay(b.date) }, last: { date: cleanDay(la.date) } };
      if (out.weights) {
        o.best.score = cleanNum(b.score, 0, 2000, 1); o.best.weight = cleanNum(b.weight, 0, 1000, 2); o.last.score = cleanNum(la.score, 0, 2000, 1);
        if (o.best.weight === null) delete o.best.weight;
      }
      if (l.change30 && cleanNum(l.change30.pct, -100, 10000, 1) !== null) o.change30 = { pct: cleanNum(l.change30.pct, -100, 10000, 1) };
      return o;
    }).filter(Boolean);
    out.prs = (Array.isArray(s.prs) ? s.prs : []).slice(0, 8).map((p) => {
      if (!p || typeof p !== 'object') return null;
      const name = cleanStr(p.name, 80), date = cleanDay(p.date);
      if (!name || !date || (p.type !== 'weight' && p.type !== 'e1rm')) return null;
      const o = { name, type: p.type, date, reps: cleanNum(p.reps, 1, 500, 0) };
      if (out.weights && cleanNum(p.value, 0, 2000, 1) !== null) o.value = cleanNum(p.value, 0, 2000, 1);
      return o;

  const parts = Array.from({ length: 70 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.35,
    vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 9 - 3, s: 4 + Math.random() * 5,
    r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: colors[Math.floor(Math.random() * colors.length)],
  }));
  const t0 = performance.now();
  (function frame(t) {
    const el = t - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalAlpha = Math.max(0, 1 - el / 1800);
    for (const p of parts) {
      p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();

// ---------------------------------------------------------------- gráficos SVG propios (sin dependencias)
const chartSpecs = new Map();
let chartSeq = 0;
/** Reserva un hueco para un gráfico; se dibuja tras el render cuando ya se conoce el ancho. */
function chartSlot(spec) {
  const id = 'chart-' + (++chartSeq);
  chartSpecs.set(id, spec);
  const h = spec.height || 220;
  return `<div class="chart" id="${id}" style="height:${h}px" role="img" aria-label="${esc(spec.label || 'Gráfico')}"></div>`;
}
function drawCharts() {
  for (const [id, spec] of chartSpecs) {
    const el = document.getElementById(id);
    if (!el) { chartSpecs.delete(id); continue; }
    drawChart(el, spec);
  }
}
function niceTicks(min, max, count = 4) {
  if (min === max) { max = min + 1; min = Math.max(0, min - 1); }
  const span = max - min;
  const step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(S.round(v, 6));
  return ticks;
}
function compactNum(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return nf(v / 1e6, 1) + ' M';
  if (a >= 1e4) return nf(v / 1e3, 0) + ' k';
  if (a >= 1e3) return nf(v / 1e3, 1) + ' k';
  return nf(v, 1);
}
function drawChart(el, spec) {
  const pts = spec.points || [];
  const W = Math.max(120, el.clientWidth);
  const H = spec.height || 220;
  const compact = !!spec.compact;
  const m = compact ? { l: 4, r: 8, t: 8, b: 8 } : { l: 48, r: 14, t: spec.unit ? 22 : 12, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  if (!pts.length) { el.innerHTML = `<p class="muted small" style="padding:12px 0">${esc(spec.empty || 'Sin datos en este período.')}</p>`; return; }
  const ys = pts.map((p) => p.y);
  let yMin = spec.type === 'bar' ? 0 : Math.min(...ys), yMax = Math.max(...ys);
  if (spec.type !== 'bar') {
    const pad = (yMax - yMin) * 0.15 || Math.max(1, yMax * 0.05);
    yMin = Math.max(0, yMin - pad); yMax = yMax + pad;
  }
  if (yMax === yMin) yMax = yMin + 1;
  const ticks = compact ? [yMin, yMax] : niceTicks(yMin, yMax, H < 180 ? 3 : 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const sy = (v) => m.t + ih - ((v - y0) / (y1 - y0 || 1)) * ih;
  let sx, band = 0;
  if (spec.type === 'bar') {
    band = iw / pts.length;
    sx = (i) => m.l + band * i + band / 2;
  } else {
    const xs = pts.map((p) => +p.x);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    sx = (i) => (x1 === x0 ? m.l + iw / 2 : m.l + ((+pts[i].x - x0) / (x1 - x0)) * iw);
  }
  const parts = [];
  if (!compact) {
    parts.push('<g class="grid">' + ticks.map((t) => `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(t)}" y2="${sy(t)}"/>`).join('') + '</g>');
    parts.push('<g class="axis">' + ticks.map((t) => `<text x="${m.l - 8}" y="${sy(t) + 4}" text-anchor="end">${compactNum(t)}</text>`).join('') +
      (spec.unit ? `<text x="${m.l - 8}" y="${m.t - 12}" text-anchor="end" style="font-size:10px">${esc(spec.unit)}</text>` : '') + '</g>');
    // etiquetas del eje X: hasta ~6, repartidas
    const maxLabels = Math.max(2, Math.floor(iw / 70));
    const stepL = Math.max(1, Math.ceil(pts.length / maxLabels));
    const idx = [];
    for (let i = 0; i < pts.length; i += stepL) idx.push(i);
    if (spec.type !== 'bar' && idx[idx.length - 1] !== pts.length - 1 && pts.length > 1) {
      if (sx(pts.length - 1) - sx(idx[idx.length - 1]) < 60) idx.pop();
      idx.push(pts.length - 1);
    }
    parts.push('<g class="axis">' + idx.map((i) => {
      const x = sx(i);
      const anchor = spec.type === 'bar' ? 'middle' : x < m.l + 30 ? 'start' : x > W - m.r - 30 ? 'end' : 'middle';
      return `<text x="${x}" y="${H - 8}" text-anchor="${anchor}">${esc(pts[i].xl)}</text>`;
    }).join('') + '</g>');
  }
  const color = 'var(--accent)';
  if (spec.type === 'bar') {
    const bw = Math.max(2, Math.min(36, band - 2));
    parts.push('<g>' + pts.map((p, i) => {
      if (!p.y) return '';
      const x = sx(i) - bw / 2, y = sy(p.y), h = sy(y0) - y, r = Math.min(4, bw / 2, h);
      return `<path d="M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${y + h} Z" fill="${color}" opacity="${i === pts.length - 1 ? 1 : 0.75}"/>`;
    }).join('') + '</g>');
  } else {
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(i)},${sy(p.y)}`).join(' ');
    const gid = el.id + '-g';
    parts.push(`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`);
    if (pts.length > 1) parts.push(`<path d="${line} L${sx(pts.length - 1)},${m.t + ih} L${sx(0)},${m.t + ih} Z" fill="url(#${gid})"/>`);
    parts.push(`<path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`);
    if (!compact || pts.length < 40) {
      parts.push('<g>' + pts.map((p, i) => {
        const last = i === pts.length - 1;
        return `<circle cx="${sx(i)}" cy="${sy(p.y)}" r="${last ? 5 : compact ? 2.5 : 3.5}" fill="${last || !compact ? color : 'var(--accent)'}" stroke="var(--surface)" stroke-width="2"/>`;
      }).join('') + '</g>');
    }
  }
  parts.push(`<line class="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>`);
  parts.push(`<rect class="hit" x="${m.l}" y="0" width="${iw}" height="${H}"/>`);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg><div class="chart-tip" hidden></div>`;
  const svg = $('svg', el), tip = $('.chart-tip', el), xh = $('.xhair', el);
  const nearest = (clientX) => {
    const r = svg.getBoundingClientRect();
    const x = ((clientX - r.left) / r.width) * W;
    let best = 0, bd = Infinity;
    for (let i = 0; i < pts.length; i++) { const d = Math.abs(sx(i) - x); if (d < bd) { bd = d; best = i; } }
    return best;
  };
  const show = (ev) => {
    const i = nearest(ev.clientX);
    const p = pts[i];
    tip.innerHTML = p.tip;
    tip.hidden = false;
    const px = sx(i), py = sy(p.y);
    const half = tip.offsetWidth / 2;
    tip.style.left = Math.min(Math.max(px, half), W - half) + 'px';
    tip.style.top = Math.max(py, tip.offsetHeight + 12) + 'px';
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
  };
  const hide = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); };
  const hit = $('.hit', el);
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', hide);
}
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(drawCharts, 150); });
